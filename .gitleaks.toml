# Gitleaks config for the pre-commit secret scan (extends the default rules).
title = "dotfiles"

[extend]
useDefault = true

[allowlist]
description = "Vendored third-party skill documentation and research notes quoting third-party API docs, both carrying placeholder example credentials (sk-1234..., myuser:mypassword, truncated PEM blocks, YOUR_API_TOKEN). The quoted content must stay verbatim, so inline gitleaks:allow comments are not an option."
paths = [
  '''dot_agents/skills/kubernetes-specialist/references/configuration\.md''',
  '''docs/research/2026-09-moshi-image-cards\.md''',
]
