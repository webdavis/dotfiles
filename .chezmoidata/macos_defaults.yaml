# macOS user defaults, declarative source of truth.
#
# Each record under `defaults:` is one declared control, applied at
# `chezmoi apply` time (Tier 1 runner: run_onchange_after_30-macos-defaults).
# What the runner renders for a record is decided by its REQUIRED `tier`:
#
#   tier: enforce   settable from the command line; renders one `defaults
#                   write`. The only tier the runner (or any tool) ever
#                   writes.
#   tier: verify    readable but NOT settable on this macOS version; drift
#                   detection only. Renders NO command; `just D` compares the
#                   record's type/value against the live read.
#   tier: manual    needs an interactive step or a device-management profile.
#                   Renders a runbook pointer line and no command. Carries a
#                   REQUIRED `runbook` field naming the runbook section, and
#                   NO type/value/host/scope/plist_path.
#
# The tier is a property of the control on this OS version, not a preference:
# when Apple removes a flag, the control moves enforce -> verify as a
# one-line data change. A record with a missing or unrecognized tier, or a
# payload that does not match its tier, ABORTS the render.
#
# Schema (enforce and verify):
#   - domain: <string>   # com.apple.dock, NSGlobalDomain, etc.
#     key:    <string>
#     type:   bool|int|float|string
#     value:  <scalar>   # must match `type`
#     tier:   enforce|verify
#     host:   current    # OPTIONAL, if set, runner uses `defaults -currentHost`
#     scope:  user|system  # OPTIONAL, absent means user. A system record is
#                          # written with sudo to a root-owned plist,
#                          # /Library/Preferences/<domain> by default. Cannot
#                          # be combined with `host` (ByHost is per-user).
#     plist_path: <path>   # OPTIONAL, system scope only: an explicit ABSOLUTE
#                          # plist path for a product that stores preferences
#                          # outside /Library/Preferences (e.g. LuLu).
#                          # Relative paths are rejected.
#     runbook: <string>    # verify only, OPTIONAL: the runbook section that
#                          # fixes a detected drift by hand. Forbidden on
#                          # enforce records (nothing consumes it there).
#
# Schema (manual):
#   - domain: <string>
#     key:    <string>
#     tier:   manual
#     runbook: <string>  # REQUIRED: the runbook section that sets it by hand
#
# Each entry in `killall:` runs after the defaults loop. cfprefsd is required
# for changes to take effect immediately (long-standing macOS plist-cache
# footgun).

macos:
  defaults:
    - domain: com.apple.dock
      key: mru-spaces
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.dock
      key: expose-group-apps
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.WindowManager
      key: GloballyEnabled
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.WindowManager
      key: EnableStandardClickToShowDesktop
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.WindowManager
      key: EnableTilingByEdgeDrag
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.WindowManager
      key: EnableTilingOptionAccelerator
      type: bool
      value: false
      tier: enforce
    - domain: com.apple.WindowManager
      key: EnableTopTilingByEdgeDrag
      type: bool
      value: false
      tier: enforce
    # Software-update parent switch. The live machine carried the latent
    # inconsistency this record pins: AutomaticCheckEnabled was unset while
    # its dependents (AutomaticDownload, CriticalUpdateInstall,
    # ConfigDataInstall) were all on, so turning the unset parent off would
    # silently disable every one of them. System scope: the plist is
    # root-owned, /Library/Preferences/com.apple.SoftwareUpdate, written
    # under sudo.
    - domain: com.apple.SoftwareUpdate
      key: AutomaticCheckEnabled
      type: bool
      value: true
      scope: system
      tier: enforce
    # Never auto-open "safe" Safari downloads. Enforce rests on read-back
    # evidence from this machine (macOS 26.2, Safari not running): a probe
    # key written to this domain exited 0, reached the container plist on
    # disk (~/Library/Containers/com.apple.Safari/Data/Library/Preferences),
    # and read back through `defaults read`. One refinement the evidence does
    # not cover: the probing process had Full Disk Access, and the process
    # applying this record later may not. That does not change the tier,
    # because the value is readable either way (`defaults read` resolves into
    # the container), so a write that fails for any reason, missing access
    # included, surfaces as drift in `just D` rather than as silent success.
    - domain: com.apple.Safari
      key: AutoOpenSafeDownloads
      type: bool
      value: false
      tier: enforce
    # LuLu outbound-firewall policy (slice 10). Six records, one per policy
    # preference, each declaring the value the live machine carried on
    # 2026-07-27: the slice codifies todays posture so a later change is
    # visible instead of silent; it changes nothing. The plist is LuLu's own
    # absolute path (plain XML, world-readable, root-writable), not a
    # /Library/Preferences domain, so each record rides slice 2's explicit
    # plist_path form. The .plist extension in the declared path is
    # load-bearing: `defaults write` on the extensionless form creates a NEW
    # file beside the real one (verified on a copy, 2026-07-27).
    #
    # CAUTION, unsettled until the operator drill in the runbook section
    # "LuLu preference write drill" runs: whether the RUNNING extension
    # honours an external write to this file is unknown (LuLu rewrites both
    # of its files at runtime, observed at wake 2026-07-27 13:25:06), and a
    # `defaults write` to it converts the XML file to a binary plist, resets
    # its mode 0644 -> 0600, and replaces the inode (all verified on a copy).
    # Every declared value equals the live one, so the first apply is
    # value-neutral, but the drill must settle the mechanics before these
    # records are trusted as enforcement rather than drift declarations.
    #
    # allowLocalHost is the single most safety-critical preference on this
    # machine, because
    # alert-dispatch.sh POSTs every page to a Hermes gateway on 127.0.0.1:8644
    # and the uptime watchdog route probe hits the same loopback URL.
    # allowLocalHost is true, which is why that hop is unfiltered and why
    # paging works at all.
    # Flipping it to false would put LuLu in front of the alerting path itself:
    # the mechanism that reports every other failure becomes the thing being
    # filtered. Do not flip it, and do not drop this record as redundant.
    - domain: com.objective-see.lulu
      key: allowLocalHost
      type: bool
      value: true
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
    # Apple-signed system processes stay allowed: blocking them breaks core
    # OS services, and the accumulated rule set already allows them anyway.
    - domain: com.objective-see.lulu
      key: allowApple
      type: bool
      value: true
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
    # DNS stays unprompted: every outbound connection needs resolution first,
    # so filtering DNS would gate all egress behind interactive prompts.
    - domain: com.objective-see.lulu
      key: allowDNS
      type: bool
      value: true
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
    # Applications already installed at LuLu install time keep their baseline
    # allow rules; flipping this only affects future installs, but declaring
    # it pins the posture the accumulated rule set was built under.
    - domain: com.objective-see.lulu
      key: allowInstalled
      type: bool
      value: true
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
    # Prompt-and-decide, never block-all: blockMode true would sever every
    # unruled outbound flow on an unattended machine, the alerting egress
    # included.
    - domain: com.objective-see.lulu
      key: blockMode
      type: bool
      value: false
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
    # Prompts stay on: passive mode would silently apply a default action to
    # every new flow, removing the interactive gate that makes the accumulated
    # rule set deliberate. (passiveModeAction and passiveModeRules are NOT
    # declared: both are 0 and unconsulted while passiveMode is false, which
    # is exactly what makes them the safe toggles for the write drill.)
    - domain: com.objective-see.lulu
      key: passiveMode
      type: bool
      value: false
      scope: system
      plist_path: /Library/Objective-See/LuLu/preferences.plist
      tier: enforce
  killall:
    - Dock
    - Finder
    - SystemUIServer
    - cfprefsd
