# Skills per harness, grouped by the command that installs them. media: skills only a media session loads. omp: skills only omp loads.
# repo: owner/repo[/path] for npx; slug: @owner/skill for clawhub; skill: a store folder another tool writes.
# on_demand: loads only when asked. hermes: profiles that link it from the store.
# claude_desktop: zipped by `just claude-desktop-skills`. hermes: `hermes -p <profile> skills install <identifier>`.
# A skill the Hermes hub refuses or lists stale reaches a profile through its npx or clawhub entry's hermes: list.
skills:
  harnesses:
    claude: {}
    codex:
      npx:
        - repo: "mattpocock/skills/skills/engineering"
          on_demand: true
        - repo: "mattpocock/skills/skills/productivity"
          on_demand: true
    codex_and_claude:
      npx:
        - repo: "agamm/claude-code-owasp"
          on_demand: true
        - repo: "blader/humanizer"
        - repo: "guwidoe/lobster-skill"
          on_demand: true
        - repo: "homeassistant-ai/skills"
          hermes:
            - "default"
          on_demand: true
        - repo: "Jeffallan/claude-skills/skills/kubernetes-specialist"
          on_demand: true
        - repo: "kunchenguid/chrome-devtools-axi"
        - repo: "kunchenguid/gh-axi"
        - repo: "mvanhorn/last30days-skill"
          hermes:
            - "lara"
          on_demand: true
        - repo: "rjyo/moshi-skill/skills/moshi-best-practices"
          hermes:
            - "default"
        - repo: "rjyo/moshi-skill/skills/play-developer-console"
          hermes:
            - "default"
          on_demand: true
        - repo: "slackapi/slack-skills-plugin/skills/slack-messaging"
        - repo: "slackapi/slack-skills-plugin/skills/slack-search"
        - repo: "steipete/agent-scripts/skills/video-transcript-downloader"
          on_demand: true
        - repo: "webdavis/scalebar"
          on_demand: true
        - repo: "webdavis/skills/plugins/tiktok-crawling/skills/tiktok-crawling"
          on_demand: true
      clawhub:
        - slug: "@gitgoodordietrying/sql-toolkit"
        - slug: "@iahmadzain/home-assistant"
          on_demand: true
        - slug: "@mkpareek0315/summarize-pro"
          hermes:
            - "default"
          on_demand: true
      but:
        - skill: "gitbutler"
          on_demand: true
      apps:
        - skill: "cua-driver"
          on_demand: true
        - skill: "rex"
    omp:
      npx:
        - repo: "anthropics/knowledge-work-plugins/legal"
          on_demand: true
    media:
      npx:
        - repo: "heygen-com/hyperframes"
          hermes:
            - "lara"
      elevenlabs:
        - hermes:
            - "lara"
    claude_desktop:
      - repo: "mattpocock/skills"
        skills:
          - "grill-me"
          - "grilling"
          - "wait-what"
      - repo: "blader/humanizer"
        skills:
          - "humanizer"
    hermes:
      default:
        - "webdavis/pns/skills/loop"
        - "webdavis/pns/skills/recap"
        - "webdavis/scalebar/skills/scalebar"
        - "skills-sh/guwidoe/lobster-skill/lobster"
      lara:
        - "skills-sh/steipete/agent-scripts/video-transcript-downloader"
        - "webdavis/skills/plugins/tiktok-crawling/skills/tiktok-crawling"
