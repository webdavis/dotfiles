# Skills per harness, grouped by the command that installs them.
# repo: owner/repo[/path] for npx; slug: @owner/skill for clawhub; skill: a store folder another tool writes.
# on_demand: loads only when asked. agent: the subagent that gets it. hermes: profiles that link it from the store.
# claude_desktop: zipped by `just claude-desktop-skills`. hermes: `hermes -p <profile> skills install <identifier>`.
# A skill the Hermes hub refuses or lists stale reaches a profile through its npx or clawhub entry's hermes: list.
skills:
  harnesses:
    claude: {}
    codex:
      npx:
        - repo: "mattpocock/skills/skills/engineering"
          on_demand: true
        - repo: "mattpocock/skills/skills/productivity"
          on_demand: true
    codex_and_claude:
      npx:
        - repo: "agamm/claude-code-owasp"
        - repo: "agavra/tuicr"
        - repo: "backnotprop/plannotator/apps/skills/core"
          on_demand: true
        - repo: "blader/humanizer"
        - repo: "clerk/skills"
          on_demand: true
        - repo: "Doist/todoist-cli"
        - repo: "heygen-com/hyperframes"
          agent: "lara"
          hermes:
            - "lara"
        - repo: "guwidoe/lobster-skill"
          on_demand: true
        - repo: "homeassistant-ai/skills"
          hermes:
