    # version is optional. An unpinned version resolves to latest on crates.io.
    cargo:
      # A Claude Code account switcher/manager.
      - name: clauth
      # The `tree-sitter` command. nvim-treesitter runs it to set up each
      # language (Python, Lua, Swift...) so Neovim can understand its code.
      # For each language it installs, it runs:
      #   1. tree-sitter generate   Turns the language's rules into C code.
      #                             Only some languages need this. Needs node.
      #   2. tree-sitter build      Compiles that C code into a file Neovim
      #                             loads. Every language needs this.
      - name: tree-sitter-cli
    uv:
      - graphifyy
      - nano-pdf
      - pymobiledevice3
      - sherlock-project
      - whisply[mlx,app]
    # fnm-managed node plus the npm CLI tools that run on it. One node version
    # per group; bumping `node` reinstalls every package under the new version
    # at the next apply.
    fnm:
      - node: "24"
        packages:
          # Pinned: the npm `latest` tag still points at 6.0.0 while the three
          # harness plugin bundles and their versions.json are on 6.0.3, so an
          # unpinned install would leave the CLI two months behind the plugins
          # that call it. `npm ls -g <pkg>@<version>` is exact, so the guard
          # above reinstalls whenever the pin moves.
          #
          # -sdk, NOT the @a5c-ai/babysitter metapackage the README names: only
          # this package ships the `adapters-hooks` bin that every Claude Code
          # hook command invokes and the Codex hook runtime resolves. The two
          # packages both declare a `babysitter` bin and cannot coexist.
          - "@a5c-ai/babysitter-sdk@6.0.3"
          # The `claude-agent-acp` bin avante.nvim's claude-code provider spawns.
          # It reaches the Claude Code CLI already on PATH, so avante runs on the
          # subscription login rather than an API key.
          - "@agentclientprotocol/claude-agent-acp"
          - "@clawdbot/lobster"
          - "@doist/todoist-cli"
          - "@earendil-works/pi-coding-agent"
          - "@elevenlabs/cli"
          - "@fission-ai/openspec"
          - "@google/gemini-cli"
          - "@mistweaverco/kulala-ls"
          - "@oliverames/mcp-server-for-ynab"
          - "@tobilu/qmd"
          - acpx
          - agentmail-cli
          - backpass
          - clawhub
          # Pinned: an overnight orchestrator that commits unattended, still
          # pre-1.0 and releasing weekly, so the version it runs under is a
          # deliberate choice rather than whatever `latest` points at that
          # night. `npm ls -g <pkg>@<version>` is exact, so the guard above
          # reinstalls whenever the pin moves.
          - "gnhf@0.1.49"
          - hyperframes
  # Tools built from their own git repository rather than this one, and
  # installed into rust_tools.install_dir with `cargo install --git`. dam is
  # the task-and-calendar CLI the herdr-damnit and damnit.nvim plugins spawn.
  # chord compiles dot_config/chord/bindings.toml into the two generated files
  # `just chord-render` writes, and CI also installs it to run the `chord check`
  # gate. A change to this file reinstalls the tools at their latest commit.
  cargo_git_tools:
    - name: chord
      repo: webdavis/chord
      package: chord
    - name: dam
      repo: webdavis/damnit
      package: damnit
    - name: lights
      repo: webdavis/lights
      package: lights
    - name: pns
      repo: webdavis/pns
      package: pns
      features: dev-tools
    - name: posture
      repo: webdavis/posture
      package: posture
    - name: uu
      repo: webdavis/uu
      package: uu

  # The herdr plugins this machine builds and LINKS rather than installing from
  # GitHub. `herdr plugin install` requires a herdr-plugin.toml committed in the
  # plugin repository; a linked plugin ships none, because its actions are a
  # function of this machine's own configuration rather than a file that could
  # be committed once for everybody. herdr-process's actions are one set per
  # declared process profile, and herdr-workspace-jump's are one jump per
  # declared workspace; each renders its manifest from this machine's config
  # via its own `generate` subcommand. The shared builder,
  # .chezmoiscripts/run_onchange_after_58, clones each plugin, compiles it,
  # generates its manifest and links the result. A change to this file
  # reinstalls the plugins at their latest commit.
  herdr_linked_plugins:
    - id: herdr-process
      repo: webdavis/herdr-process
    - id: herdr-workspace-jump
      repo: webdavis/herdr-workspace-jump

  herdr_plugins:
    # run_after_53 installs a missing plugin at apply. Every plugin this machine
    # wants is listed here except the two linked ones (see herdr_linked_plugins
    # above).
    #
    # herdr-smart-nav is ours, in its own public repository so it installs by
    # the same convention as everybody else's.
    - id: herdr-smart-nav
      repo: webdavis/herdr-smart-nav
    # The task pane. Its config lives at
    # dot_config/herdr/plugins/config/herdr-damnit/config.toml and names the
    # KeePassXC entry the token comes from; the plugin refuses to run until one
    # of its two token indirections resolves.
    - id: herdr-damnit
      repo: webdavis/herdr-damnit
    - id: worktrunk
      repo: devashish2203/herdr-worktrunk
    - id: tab-smart-rename
      repo: iurysza/herdr-tab-smart-rename
    - id: persiyanov.reviewr
      repo: persiyanov/herdr-reviewr
    - id: herdr-agent-quota
      repo: levi-qiao/herdr-agent-quota
    - id: herdr-bar
      repo: jeffarese/herdr-bar
    - id: chmarax.herdr-nvim
      repo: ChmaraX/herdr-nvim
    - id: annotate
      repo: plannotator/herdr-annotate
    - id: furkankly.zoetrope
      repo: furkankly/zoetrope/herdr-plugin
    # Depends on the `clauth` binary, which packages.macos.cargo installs.
    - id: clauth
      repo: uwuclxdy/clauth/herdr-plugin
