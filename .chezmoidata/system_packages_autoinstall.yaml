packages:
  herdr_plugins:
    # One roster, two consumers: run_after_53 installs missing plugins at apply,
    # and uu's config template renders it into the herdr lane that refreshes
    # them weekly. Local plugins (smart-nav, last-workspace) are built from this
    # repo by their own script, not listed.
    - id: worktrunk
      repo: devashish2203/herdr-worktrunk
    - id: tab-smart-rename
      repo: iurysza/herdr-tab-smart-rename
    - id: herdr-sidebar
      repo: alexarthurs/herdr-sidebar/plugins/herdr-sidebar
    - id: persiyanov.reviewr
      repo: persiyanov/herdr-reviewr
    - id: herdr-workflows
      repo: aorumbayev/herdr-workflows
    - id: herdr-bar
      repo: jeffarese/herdr-bar
    - id: chmarax.herdr-nvim
      repo: ChmaraX/herdr-nvim
    - id: herdr-file-viewer
      repo: smarzban/herdr-file-viewer
  macos:
