      - graphifyy
      - nano-pdf
      - pymobiledevice3
      - sherlock-project
      - whisply[mlx,app]
    fnm:
      - node: "24"
        packages:
          # Pinned to the version the babysitter plugins ship.
          # Only this -sdk package provides the adapters-hooks command.
          - "@a5c-ai/babysitter-sdk@6.0.3"
          - "@agentclientprotocol/claude-agent-acp"
          - "@clawdbot/lobster"
          - "@doist/todoist-cli"
          - "@earendil-works/pi-coding-agent"
          - "@elevenlabs/cli"
          - "@fission-ai/openspec"
          - "@google/gemini-cli"
          - "@mistweaverco/kulala-ls"
          - "@oliverames/mcp-server-for-ynab"
          - "@tobilu/qmd"
          - "@toon-format/cli"
          - acpx
          - agentmail-cli
          - backpass
          - chrome-devtools-axi
          - clawhub
          # Pinned because it makes commits on its own and is not yet stable.
          - "gnhf@0.1.49"
          - hyperframes
  cargo_git_tools:
    - name: chord
      repo: webdavis/chord
      package: chord
    - name: dam
      repo: webdavis/damnit
      package: damnit
    - name: lights
      repo: webdavis/lights
      package: lights
    - name: pns
      repo: webdavis/pns
      package: pns
      features: dev-tools
    - name: posture
      repo: webdavis/posture
      package: posture
    - name: uu
      repo: webdavis/uu
      package: uu

  # Built from a local clone and linked into herdr,
  # because their manifests come from this machine's config.
  herdr_linked_plugins:
    - id: herdr-process
      repo: webdavis/herdr-process
    - id: herdr-picker
      repo: webdavis/herdr-picker

  herdr_plugins:
    - id: herdr-smart-nav
      repo: webdavis/herdr-smart-nav
    - id: herdr-damnit
      repo: webdavis/herdr-damnit
    - id: worktrunk
      repo: devashish2203/herdr-worktrunk
    - id: tab-smart-rename
      repo: iurysza/herdr-tab-smart-rename
    - id: persiyanov.reviewr
      repo: persiyanov/herdr-reviewr
    - id: chmarax.herdr-nvim
      repo: ChmaraX/herdr-nvim
    - id: annotate
      repo: plannotator/herdr-annotate
    - id: furkankly.zoetrope
      repo: furkankly/zoetrope/herdr-plugin
    - id: clauth
      repo: uwuclxdy/clauth/herdr-plugin

  # Tools built from a local clone. Both paths are relative to the home folder.
  source_builds:
    scalebar:
      source_dir: "workspaces/Ivy/webdavis/scalebar"
      install_dir: ".local/libexec/scalebar"
