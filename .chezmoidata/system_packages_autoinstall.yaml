    # Third-party crates installed with `cargo install`, for tools that ship
    # on crates.io with no Homebrew formula. The four Rust tools THIS
    # repository builds are not here: their source lives in this checkout and
    # each has its own apply-time builder, with the install destination
    # declared in .chezmoidata/rust_tools.yaml.
    #
    # `version` is required rather than optional, because an unpinned
    # `cargo install` resolves to whatever crates.io calls latest on the day a
    # fresh machine is built, which is not a decision anyone made.
    cargo:
      # A launcher and account manager for Claude Code. Its herdr plugin
      # (declared under packages.herdr_plugins) reads this binary's output and
      # is pinned to the matching tag, so the two versions move TOGETHER or the
      # sidebar renders a format the installed binary no longer prints.
      - name: clauth
        version: "0.15.2"
    uv:
      - graphifyy
      - nano-pdf
      - pymobiledevice3
      - sherlock-project
      - whisply[mlx,app]
    # fnm-managed node plus the npm CLI tools that run on it. One node version
    # per group; bumping `node` reinstalls every package under the new version
    # at the next apply.
    fnm:
      - node: "24"
        packages:
          # Pinned: the npm `latest` tag still points at 6.0.0 while the three
          # harness plugin bundles and their versions.json are on 6.0.3, so an
          # unpinned install would leave the CLI two months behind the plugins
          # that call it. `npm ls -g <pkg>@<version>` is exact, so the guard
          # above reinstalls whenever the pin moves.
          #
          # -sdk, NOT the @a5c-ai/babysitter metapackage the README names: only
          # this package ships the `adapters-hooks` bin that every Claude Code
          # hook command invokes and the Codex hook runtime resolves. The two
          # packages both declare a `babysitter` bin and cannot coexist.
          - "@a5c-ai/babysitter-sdk@6.0.3"
          - "@clawdbot/lobster"
          - "@doist/todoist-cli"
          - "@elevenlabs/cli"
          - "@fission-ai/openspec"
          - "@google/gemini-cli"
          - "@mistweaverco/kulala-ls"
          - "@oliverames/mcp-server-for-ynab"
          - "@tobilu/qmd"
          - acpx
          - agentmail-cli
          - backpass
          - clawhub
          # Pinned: an overnight orchestrator that commits unattended, still
          # pre-1.0 and releasing weekly, so the version it runs under is a
          # deliberate choice rather than whatever `latest` points at that
          # night. `npm ls -g <pkg>@<version>` is exact, so the guard above
          # reinstalls whenever the pin moves.
          - "gnhf@0.1.49"
          - hyperframes
          - mcporter
  # The one herdr plugin this machine builds and LINKS rather than installing
  # from GitHub. `herdr plugin install` requires a herdr-plugin.toml committed in
  # the plugin repository, and herdr-process has none: its actions are one set per
  # declared process profile, so the manifest is rendered from this machine's own
  # config by `herdr-process generate`. Its builder,
  # .chezmoiscripts/run_onchange_after_58, clones this revision, compiles it,
  # generates the manifest and links the result.
  herdr_linked_plugin:
    id: herdr-process
    repo: webdavis/herdr-process
    ref: c587dda54e2fa71722630ae53974101cdf76989f

  herdr_plugins:
    # One roster, two consumers: run_after_53 installs missing plugins at apply,
    # and uu's config template renders it into the herdr lane that refreshes
    # them weekly. Every plugin this machine wants is listed here except
    # herdr-process, which is linked rather than installed (see
    # herdr_linked_plugin above).
    #
    # The first two are ours, extracted into their own public repositories on
    # 2026-09-17 so that they install by the same convention as everybody
    # else's. Their `ref` is the revision herdr checks out and builds; herdr v1
    # has no `plugin update`, so bumping one of these values is only half the
    # job and the operator reinstalls, exactly as for a third-party pin.
    - id: herdr-workspace-jump
      repo: webdavis/herdr-workspace-jump
      ref: a7c3fe40e22a81fe8abd6ee3542f782547b66fb1
    - id: herdr-smart-nav
      repo: webdavis/herdr-smart-nav
      ref: b82c2cf94de97cd3c6746d93de5a8e8da9fd112f
    - id: worktrunk
      repo: devashish2203/herdr-worktrunk
    - id: tab-smart-rename
      repo: iurysza/herdr-tab-smart-rename
    - id: persiyanov.reviewr
      repo: persiyanov/herdr-reviewr
    - id: herdr-agent-quota
      repo: levi-qiao/herdr-agent-quota
    - id: herdr-bar
      repo: jeffarese/herdr-bar
    - id: chmarax.herdr-nvim
      repo: ChmaraX/herdr-nvim
    - id: annotate
      repo: plannotator/herdr-annotate
    - id: furkankly.zoetrope
      repo: furkankly/zoetrope/herdr-plugin
    # Pinned to the tag the `clauth` binary itself is pinned to in the cargo
    # lane: the plugin reads the binary's output, so the two move together or
    # the sidebar reads a format the installed binary no longer prints.
    - id: clauth
      repo: uwuclxdy/clauth/herdr-plugin
      ref: v0.15.2
