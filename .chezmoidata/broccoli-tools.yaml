# Tools a Broccoli work session loads from its plugin folders under ~/.config/agents/.
# npx: owner/repo[/path], as in agent-skills.yaml. mcp_servers: Claude's .mcp.json shape; a header value may be
# {vault, field, prefix} so the secret is read from KeePassXC. packages: the system_packages_autoinstall.yaml shape.
broccoli:
  tech_support:
    npx:
      - repo: "twilio/ai/skills/twilio/twilio-cli-reference"
      - repo: "twilio/ai/skills/twilio/twilio-debugging-observability"
      - repo: "twilio/ai/skills/twilio/twilio-call-recordings"
      - repo: "twilio/ai/skills/twilio/twilio-lookup-phone-intelligence"
      - repo: "twilio/ai/skills/twilio/twilio-numbers-senders"
      - repo: "twilio/ai/skills/twilio/twilio-messaging-webhooks"
      - repo: "twilio/ai/skills/twilio/twilio-sms-isv-setup"
      - repo: "twilio/ai/skills/twilio/twilio-compliance-traffic"
      - repo: "twilio/ai/skills/twilio/twilio-messaging-services"
      - repo: "twilio/ai/skills/twilio/twilio-sms-send-message"
      - repo: "twilio/ai/skills/twilio/twilio-voice-twiml"
      - repo: "twilio/ai/skills/twilio/twilio-voice-outbound-calls"
      - repo: "twilio/ai/skills/twilio/twilio-reliability-patterns"
      - repo: "twilio/ai/skills/twilio/twilio-security-hardening"
      - repo: "temporalio/skill-temporal-cloud"
      - repo: "temporalio/claude-temporal-plugin"
      - repo: "resend/resend-skills"
      - repo: "clerk/skills"
      - repo: "supabase/agent-skills"
      - repo: "langchain-ai/langsmith-skills"
    mcp_servers:
      devin:
        type: http
        url: https://mcp.devin.ai/mcp
        headers:
          Authorization:
            vault: devin-broccoli-api-access
            field: personal-access-token
            prefix: 'Bearer '
          X-Org-Id:
            vault: devin-broccoli-api-access
            field: UserName
        ask:
          - devin_session_create
      resend:
        type: http
        url: https://mcp.resend.com/mcp
      clerk:
        type: http
        url: https://mcp.clerk.com/mcp
      supabase:
        type: http
        url: https://mcp.supabase.com/mcp?read_only=true
      langsmith:
        type: http
        url: https://api.smith.langchain.com/mcp
  engineering:
    npx:
      - repo: "Infisical/ai-skills/skills/infisical-access-control"
      - repo: "Infisical/ai-skills/skills/infisical-api"
      - repo: "Infisical/ai-skills/skills/infisical-app-connections"
      - repo: "Infisical/ai-skills/skills/infisical-dynamic-secrets"
      - repo: "Infisical/ai-skills/skills/infisical-gateway"
      - repo: "Infisical/ai-skills/skills/infisical-kms"
      - repo: "Infisical/ai-skills/skills/infisical-kubernetes-operator"
      - repo: "Infisical/ai-skills/skills/infisical-pam"
      - repo: "Infisical/ai-skills/skills/infisical-pki"
      - repo: "Infisical/ai-skills/skills/infisical-secret-rotation"
      - repo: "Infisical/ai-skills/skills/infisical-secret-scanning"
      - repo: "Infisical/ai-skills/skills/infisical-secret-syncs"
      - repo: "Infisical/ai-skills/skills/infisical-self-host"
      - repo: "Infisical/ai-skills/skills/infisical-setup"
      - repo: "Infisical/ai-skills/skills/infisical-sso"
      - repo: "Infisical/ai-skills/skills/infisical-terraform"
      - repo: "docker/skills/skills/docker-build-strategies"
      - repo: "docker/skills/skills/docker-compose-patterns"
      - repo: "docker/skills/skills/docker-destructive-guardrails"
      - repo: "docker/skills/skills/docker-docs"
      - repo: "docker/skills/skills/docker-project-foundations"
      - repo: "docker/skills/skills/docker-sandboxes-env"
      - repo: "docker/skills/skills/docker-sandboxes-kits"
      - repo: "docker/skills/skills/docker-sandboxes-lifecycle"
      - repo: "docker/skills/skills/docker-sandboxes-network-credentials"
      - repo: "vercel/turborepo/skills/turborepo"
      - repo: "redpanda-data/skills/skills/adp"
      - repo: "redpanda-data/skills/skills/connect-debugging"
      - repo: "redpanda-data/skills/skills/connect"
      - repo: "redpanda-data/skills/skills/rpk-cloud"
      - repo: "redpanda-data/skills/skills/rpk-cluster"
      - repo: "redpanda-data/skills/skills/rpk-debug"
      - repo: "redpanda-data/skills/skills/rpk-group"
      - repo: "redpanda-data/skills/skills/rpk-redpanda"
      - repo: "redpanda-data/skills/skills/rpk-registry"
      - repo: "redpanda-data/skills/skills/rpk-security"
      - repo: "redpanda-data/skills/skills/rpk-topic"
      - repo: "redpanda-data/skills/skills/rpk-transform"
      - repo: "redpanda-data/skills/skills/rpk"
      - repo: "redpanda-data/skills/skills/sql-admin-api"
      - repo: "redpanda-data/skills/skills/sql-debugging"
      - repo: "redpanda-data/skills/skills/sql-federated-queries"
      - repo: "redpanda-data/skills/skills/sql"
      - repo: "redpanda-data/skills/skills/streaming-admin-api"
      - repo: "redpanda-data/skills/skills/streaming-debugging"
      - repo: "redpanda-data/skills/skills/streaming"
      - repo: "redis/agent-skills"
      - repo: "svix/ai"
      - repo: "langchain-ai/langchain-skills/config/skills/langchain-fundamentals"
      - repo: "langchain-ai/langchain-skills/config/skills/langchain-middleware"
      - repo: "langchain-ai/langchain-skills/config/skills/langchain-rag"
      - repo: "langchain-ai/langchain-skills/config/skills/langgraph-cli"
      - repo: "langchain-ai/langchain-skills/config/skills/langgraph-decision-models"
      - repo: "langchain-ai/langchain-skills/config/skills/langgraph-fundamentals"
      - repo: "langchain-ai/langchain-skills/config/skills/langgraph-human-in-the-loop"
      - repo: "mastra-ai/skills"
      - repo: "vercel/ai/skills/migrate-ai-sdk-v6-to-v7"
      - repo: "typesafe-ai/skills"
      - repo: "livekit/agent-skills"
      - repo: "liveblocks/skills"
    mcp_servers:
      infisical_docs:
        type: http
        url: https://infisical.com/docs/mcp
      redpanda_docs:
        type: http
        url: https://docs.redpanda.com/mcp
      langchain_docs:
        type: http
        url: https://docs.langchain.com/mcp
      langchain_reference:
        type: http
        url: https://reference.langchain.com/mcp
      mastra_docs:
        type: stdio
        command: npx
        args:
          - -y
          - '@mastra/mcp-docs-server@latest'
      livekit_docs:
        type: http
        url: https://docs.livekit.io/mcp
      aws:
        type: stdio
        command: uvx
        args:
          - mcp-proxy-for-aws-cli@latest
          - https://aws-mcp.us-east-1.api.aws/mcp
          - --read-only
  packages:
    macos:
      homebrew:
        taps:
          - redpanda-data/tap
          - svix/svix
          - twilio/brew
          - resend/cli
          - clerk/stable
          - supabase/tap
        trusted_taps:
          - redpanda-data/tap
          - svix/svix
          - twilio/brew
          - resend/cli
          - clerk/stable
          - supabase/tap
        formulae:
          - temporal
          - redpanda-data/tap/redpanda
          - redis
          - svix/svix/svix-cli
          - awscli
          - twilio/brew/twilio
          - resend/cli/resend
          - clerk/stable/clerk
          - supabase/tap/supabase
          - livekit-cli
        casks:
          - claude-code@latest
          - devin-cli
      uv:
        - langgraph-cli
        - litellm[cli]
      fnm:
        - node: "24"
          packages: []
