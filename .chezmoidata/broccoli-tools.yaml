    mcp_servers:
      devin:
        type: http
        url: https://mcp.devin.ai/mcp
        headers:
          Authorization:
            vault: devin-broccoli-api-access
            field: personal-access-token
            prefix: 'Bearer '
          X-Org-Id:
            vault: devin-broccoli-api-access
            field: UserName
        ask:
          - devin_session_create
      resend:
        type: http
        url: https://mcp.resend.com/mcp
      clerk:
        type: http
        url: https://mcp.clerk.com/mcp
      supabase:
        type: http
        url: https://mcp.supabase.com/mcp?read_only=true
      langsmith:
        type: http
        url: https://api.smith.langchain.com/mcp
      deepgram:
        type: stdio
        command: dg
        args:
          - mcp
      newrelic:
        type: http
        url: https://mcp.newrelic.com/mcp/
      hubspot:
        type: http
        url: https://mcp.hubspot.com/anthropic
        ask:
