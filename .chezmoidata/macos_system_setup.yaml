# macOS system settings that need admin rights.
#
# Every record needs a description and a tier:
#   enforce  runs `command` (prefixed with sudo when `sudo: true`). Must be
#            safe to run repeatedly.
#   verify   checked for drift elsewhere; runs nothing.
#   manual   prints a pointer to `runbook`, a section of
#            docs/runbooks/macos-fresh-machine-quickstart.md; runs nothing.

macos:
  system_setup:
    - description: "Install Nix with the NixOS-maintained installer"
      command: '"$CHEZMOI_SOURCE_DIR/macos-system-setup/install-nix.sh"'
      tier: enforce
    - description: "Install self-healing nix-installer repair LaunchDaemon (NixOS fork)"
      command: '"$CHEZMOI_SOURCE_DIR/macos-system-setup/install-nix-repair-hook.sh"'
      sudo: true
      tier: enforce
    - description: "Firewall: enable the application firewall (must stay before the records below so a partial run leaves the firewall on, never policies stored with the firewall off)"
      command: "/usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on"
      sudo: true
      tier: enforce
    - description: "Firewall: enable stealth mode (drop unsolicited probes silently)"
      command: "/usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on"
      sudo: true
      tier: enforce
    - description: "Firewall: auto-allow incoming connections for built-in signed software"
      command: "/usr/libexec/ApplicationFirewall/socketfilterfw --setallowsigned on"
      sudo: true
      tier: enforce
    - description: "Firewall: auto-allow incoming connections for downloaded signed software"
      command: "/usr/libexec/ApplicationFirewall/socketfilterfw --setallowsignedapp on"
      sudo: true
      tier: enforce
    - description: "SSH: install the public-key-only sshd drop-in (000-ssh-hardening.conf) and verify the effective configuration"
      command: '"$HOME/.local/bin/ssh-hardening.sh"'
      tier: enforce
    - description: "OverSight: allow its Notification Center alerts (its only output channel)"
      tier: manual
      runbook: "OverSight notification delivery"
    - description: "LuLu: approve its system extension (a one-time macOS security consent)"
      tier: manual
      runbook: "LuLu system extension approval"
    - description: "LuLu: create the required outbound allow rules by answering its prompts"
      tier: manual
      runbook: "LuLu rule creation"
  tailscale_magicdns_fallback_hosts:
    - fqdn: mister.tail2f2430.ts.net
      ip: "100.109.58.54"
      short: mister
