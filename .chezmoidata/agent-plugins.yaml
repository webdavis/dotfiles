# Plugins per harness: a marketplace owner/repo and the <plugin>@<marketplace> ids installed from it.
# marketplace_in_settings: false keeps a marketplace out of settings.json because its own tool manages it.
# omp.plugins lists what omp's default profile installs into its own folders; each id is also one Claude Code installs.
# omp.extensions lists the npm extensions of omp's default profile; a tool named under allow runs unasked.
# omp.ask lists the tools omp's default profile asks before calling; a tool is named under allow or ask, never both.
# hermes lists plugin catalog names.
plugins:
  harnesses:
    codex:
      - marketplace: "addyosmani/agent-skills"
        plugins:
          - "agent-skills@agent-skills"
    claude:
      - marketplace: "anthropics/claude-plugins-official"
        plugins:
          - "frontend-design@claude-plugins-official"
          - "playwright@claude-plugins-official"
          - "security-guidance@claude-plugins-official"
          - "swift-lsp@claude-plugins-official"
          - "rust-analyzer-lsp@claude-plugins-official"
          - "skill-creator@claude-plugins-official"
          - "claude-md-management@claude-plugins-official"
      - marketplace: "anthropics/skills"
        plugins:
          - "document-skills@anthropic-agent-skills"
      - marketplace: "openai/codex-plugin-cc"
        plugins:
          - "codex@openai-codex"
      - marketplace: "max-sixty/worktrunk"
        plugins:
          - "worktrunk@worktrunk"
      - marketplace: "mattpocock/skills"
        plugins:
          - "mattpocock-skills@mattpocock"
      - marketplace: "uwuclxdy/clauth"
        plugins:
          - "clauth@clauth"
        marketplace_in_settings: false
      - marketplace: "addyosmani/agent-skills"
        plugins:
          - "agent-skills@addy-agent-skills"
    omp:
      plugins:
        - marketplace: "mattpocock/skills"
          plugins:
            - "mattpocock-skills@mattpocock"
        - marketplace: "addyosmani/agent-skills"
          plugins:
            - "agent-skills@addy-agent-skills"
        - marketplace: "DietrichGebert/ponytail"
          plugins:
            - "ponytail@ponytail"
        - marketplace: "obsidianmd/obsidian-skills"
          plugins:
            - "obsidian@obsidian-skills"
        - marketplace: "webdavis/pns"
          plugins:
            - "pns@pns"
        - marketplace: "webdavis/skills"
          plugins:
            - "clean-code@webdavis"
            - "git@webdavis"
        - marketplace: "max-sixty/worktrunk"
          plugins:
            - "worktrunk@worktrunk"
        - marketplace: "anthropics/skills"
          plugins:
            - "document-skills@anthropic-agent-skills"
        - marketplace: "anthropics/claude-plugins-official"
          plugins:
            - "frontend-design@claude-plugins-official"
            - "skill-creator@claude-plugins-official"
            - "security-guidance@claude-plugins-official"
            - "playwright@claude-plugins-official"
      extensions:
        - package: "@ff-labs/pi-fff"
          allow:
            - "fffind"
            - "ffgrep"
            - "fff-multi-grep"
        - package: "omp-cache-meter"
        - package: "@jetserge/pi-contextual-stash"
        - package: "omp-clear-screen"
      ask:
        - "mcp__workspace_mcp_batch_modify_gmail_message_labels"
        - "mcp__workspace_mcp_check_drive_file_public_access"
        - "mcp__workspace_mcp_copy_drive_file"
        - "mcp__workspace_mcp_create_drive_file"
        - "mcp__workspace_mcp_create_drive_folder"
        - "mcp__workspace_mcp_draft_gmail_message"
        - "mcp__workspace_mcp_get_doc_as_markdown"
        - "mcp__workspace_mcp_get_doc_content"
        - "mcp__workspace_mcp_get_drive_file_content"
        - "mcp__workspace_mcp_get_drive_file_download_url"
        - "mcp__workspace_mcp_get_drive_file_permissions"
        - "mcp__workspace_mcp_get_drive_shareable_link"
        - "mcp__workspace_mcp_get_events"
        - "mcp__workspace_mcp_get_gmail_attachment_content"
        - "mcp__workspace_mcp_get_gmail_message_content"
        - "mcp__workspace_mcp_get_gmail_messages_content_batch"
        - "mcp__workspace_mcp_get_gmail_thread_content"
        - "mcp__workspace_mcp_get_gmail_threads_content_batch"
        - "mcp__workspace_mcp_get_presentation"
        - "mcp__workspace_mcp_get_spreadsheet_info"
        - "mcp__workspace_mcp_list_calendars"
        - "mcp__workspace_mcp_list_docs_in_folder"
        - "mcp__workspace_mcp_list_drive_items"
        - "mcp__workspace_mcp_list_gmail_filters"
        - "mcp__workspace_mcp_list_gmail_labels"
        - "mcp__workspace_mcp_list_spreadsheets"
        - "mcp__workspace_mcp_manage_calendar"
        - "mcp__workspace_mcp_manage_drive_access"
        - "mcp__workspace_mcp_manage_event"
        - "mcp__workspace_mcp_manage_focus_time"
        - "mcp__workspace_mcp_manage_gmail_filter"
        - "mcp__workspace_mcp_manage_gmail_label"
        - "mcp__workspace_mcp_manage_out_of_office"
        - "mcp__workspace_mcp_modify_gmail_message_labels"
        - "mcp__workspace_mcp_query_freebusy"
        - "mcp__workspace_mcp_read_sheet_values"
        - "mcp__workspace_mcp_search_docs"
        - "mcp__workspace_mcp_search_drive_files"
        - "mcp__workspace_mcp_search_gmail_messages"
        - "mcp__workspace_mcp_send_gmail_message"
        - "mcp__workspace_mcp_set_drive_file_permissions"
        - "mcp__workspace_mcp_update_drive_file"
    claude_builtins:
      - "cc-plugin-you-should-know@builtin"
    codex_and_claude:
      - marketplace: "DietrichGebert/ponytail"
        plugins:
          - "ponytail@ponytail"
      - marketplace: "obsidianmd/obsidian-skills"
        plugins:
          - "obsidian@obsidian-skills"
      - marketplace: "webdavis/pns"
        plugins:
          - "pns@pns"
      - marketplace: "webdavis/skills"
        plugins:
          - "clean-code@webdavis"
          - "git@webdavis"
    hermes:
      - "hermes-memory-wiki"
      - "homeassistant"
      - "claude-subscription-directsdk"
      - "quota"
      - "hermes-tailscale"
