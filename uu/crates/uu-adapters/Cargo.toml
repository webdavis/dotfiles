# WHAT THIS BINARY IS ALLOWED TO SPAWN: the lane subjects themselves (`herdr`,
# and whatever program a `command` lane's own config declares) and the
# deployed pns binary for alerts. Nothing else. Records do not spawn anything
# at all: they are one signed POST made in process.
#
# NOTHING HERE REACHES ANOTHER TOOL'S WORKSPACE. uu, pns, posture and lights
# ship as separate projects installed independently with `cargo install --git`,
# by people who do not have this repository, so a path dependency climbing into
# a sibling workspace would make uu buildable only inside this checkout. The
# signing and POST seam that used to come from `pns-hermes` is uu's own now, in
# `signed_post.rs`, which says why at the top. Runtime integration is untouched
# and unaffected: uu still SPAWNS the deployed pns binary for alerts.

[package]
name = "uu-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
uu-application = { path = "../uu-application" }
uu-domain = { path = "../uu-domain" }
uu-protocol = { path = "../uu-protocol" }
# The one dependency taken for a system FACT rather than a format, matching
# pns's own reasoning: std answers neither "what is this machine called"
# (`gethostname`) nor "which UTC calendar day is this second" (`gmtime_r`), and
# both are on every record. It is already compiled in this tree behind pns.
libc = "0.2.189"
serde_json = "1.0.151"
# Rustls rather than the system TLS, matching the pinned versions this signing
# path was moved from, so the wire behaviour does not change with the move.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
hmac = "0.13.0"
sha2 = "0.11.0"
# Parse only, matching pns: nothing here ever writes TOML back out.
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
