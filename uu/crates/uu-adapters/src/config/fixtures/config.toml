[schedule]
day = "sunday"
time = "12:00"
[records]
url = "http://127.0.0.1:8644/webhooks/unattended-upgrades"
key = "/stand-in"
[alerts]
binary = "/stand-in/.local/libexec/pns/pns"
[lanes.herdr]
type = "herdr"
binary = "/stand-in/.local/bin/herdr"
deadline_secs = 21600
plugins = [{ id = "stand-in", repo = "stand-in" }]
[lanes.brew]
type = "brew"
brew = "/opt/homebrew/bin/brew"
mas = "/opt/homebrew/bin/mas"
tailscaled = "/opt/homebrew/opt/tailscale/bin/tailscaled"
osquery_converge = "/stand-in/.local/libexec/osquery/osquery-converge.sh"
mas_manifest = "/stand-in/.local/state/homebrew/mas.Brewfile"
upgrade_record = "/stand-in/.local/state/homebrew-weekly-upgrade/last-upgrade-changes.tsv"
deadline_secs = 21600
[lanes.npm]
type = "npm"
binary = "/stand-in/.local/share/fnm/aliases/default/bin/npm"
deadline_secs = 21600
[lanes.uv]
type = "uv"
binary = "/opt/homebrew/bin/uv"
deadline_secs = 21600
