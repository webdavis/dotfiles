# pns-protocol: the versioned wire contracts, and nothing behind them.
#
# NO WORKSPACE DEPENDENCIES, deliberately, including pns-domain. This crate is
# what a third-party producer compiles against and what an executable delivery
# destination is handed; if it imported the domain, the internal model would
# leak into an external contract and every domain change would become a wire
# change. The translation between the two lives in the adapters, where a
# version skew can be absorbed.
#
# The two dependencies are the format: an envelope is JSON, and JSON is a
# format nobody should hand-parse. `preserve_order` stays OFF here on purpose.
# Cargo unifies features across the workspace, so switching it on in this
# crate would re-order the keys of every JSON object the root package writes,
# including the executable channel's stdin line that today's `<name>.sh`
# scripts read byte for byte.

[package]
name = "pns-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
