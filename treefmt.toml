[global]
excludes = [
  ".direnv/**",
  ".worktrees/**",
  "**/vendor/**",
  "**/.vendor/**",
  "**/node_modules/**",
]

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh", "*.bash", "dot_bash*", "dot_profile"]
excludes = ["*.tmpl"]

[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-ci", "-s", "-w"]
includes = ["*.sh", "*.bash", "dot_bash*", "dot_profile"]
excludes = ["*.tmpl"]

# Checks only the vendored plugins, so untracked target/ build trees stay out.
[formatter.rust-file-size]
command = "scripts/treefmt/rust-file-size.sh"
includes = ["dot_local/share/**/*.rs"]

# Skill, agent and output-style Markdown stays exactly as written.
[formatter.mdformat]
command = "mdformat"
includes = ["*.md"]
excludes = [
  "private_dot_claude/skills/**",
  "private_dot_claude/agents/**",
  "private_dot_claude/output-styles/**",
  # A vendored skill kept byte-identical to its upstream.
  "private_dot_hermes/private_skills/**",
  "docs/superpowers/**",
  # Fails mdformat's round-trip check.
  "docs/research/2026-04-12-worktrunk.md",
  # Long lines keep one rule per line readable there.
  "AGENTS.md",
  "private_dot_codex/AGENTS.md",
]

[formatter.mdformat-rules]
command = "mdformat"
options = ["--wrap", "keep"]
includes = ["AGENTS.md", "private_dot_codex/AGENTS.md"]

# Skips dot_aerospace.toml to keep its hand alignment.
# Skips modify_ templates because taplo cannot parse their template directives.
# Patterns match whole paths, so modify_ needs a top-level and a nested pattern.
[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
excludes = ["dot_aerospace.toml", "modify_*", "**/modify_*"]

[formatter.actionlint]
command = "actionlint"
includes = [".github/workflows/*.yml", ".github/workflows/*.yaml"]

# modify_ templates hold template directives jq cannot parse.
[formatter.jq-validate]
command = "scripts/treefmt/jq-validate.sh"
includes = ["*.json"]
excludes = ["modify_*", "**/modify_*"]

# Checks both agent data files together for a skill or plugin that reaches one harness twice.
[formatter.agent-data-validate]
command = "scripts/treefmt/agent-data-validate.sh"
includes = [".chezmoidata/agent-plugins.yaml", ".chezmoidata/agent-skills.yaml"]

[formatter.yq-validate]
command = "scripts/treefmt/yq-validate.sh"
includes = [
  ".chezmoidata/*.yaml",
  ".chezmoidata/*.yml",
  "Library/Application Support/espanso/**/*.yaml",
  "Library/Application Support/espanso/**/*.yml",
]

[formatter.espanso-match-render]
command = "scripts/treefmt/espanso-match-render.sh"
includes = [
  "Library/Application Support/espanso/**/*.yaml.tmpl",
  "Library/Application Support/espanso/**/*.yml.tmpl",
]

# The script shellchecks the shell templates that render without the vault.
[formatter.shellcheck-rendered-template]
command = "scripts/treefmt/shellcheck-rendered-template.sh"
includes = [".chezmoiscripts/*.sh.tmpl", "dot_*.tmpl"]

[formatter.osquery-config-render]
command = "scripts/treefmt/osquery-config-render.sh"
includes = [
  "dot_local/libexec/posture/converge/desired/*.conf",
  "dot_local/libexec/posture/converge/desired/*.conf.tmpl",
  "dot_local/libexec/posture/converge/desired/**/*.conf",
  "dot_local/libexec/posture/converge/desired/**/*.conf.tmpl",
]

# Lists both globs so matching never relies on `*` crossing `/`.
[formatter.stylua]
command = "stylua"
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

[formatter.emmylua-check]
command = "emmylua_check"
options = ["--config", "dot_config/nvim/dot_emmyrc.json", "--severity", "error"]
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

[formatter.luacheck]
command = "luacheck"
options = ["--config", "dot_config/nvim/dot_luacheckrc"]
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

# Lists both globs for the reason stylua gives above.
[formatter.ruff-check]
command = "ruff"
options = ["check"]
includes = [
  "dot_config/herdr/plugins/config/herdr-picker/pickers/lib/*.py",
  "dot_config/herdr/plugins/config/herdr-picker/pickers/lib/**/*.py",
]

[formatter.ruff-format]
command = "ruff"
options = ["format", "--check"]
includes = [
  "dot_config/herdr/plugins/config/herdr-picker/pickers/lib/*.py",
  "dot_config/herdr/plugins/config/herdr-picker/pickers/lib/**/*.py",
]
