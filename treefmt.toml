# treefmt configuration for the STANDALONE treefmt binary (brew formula), the
# single lint/format orchestrator. Replaces treefmt.nix + treefmt-nix: same
# formatters and rules, no nix evaluation (operator ruling 2026-08-05). Tool
# versions come from Homebrew (.chezmoidata/system_packages_autoinstall.yaml)
# and the uv-managed mdformat; single-contributor repo, so cross-machine
# version pinning lost its audience.
#
# Style rules preserved:
#   - shell: shfmt -i 2 -ci -s; shellcheck (root .shellcheckrc disables SC1090/SC1091)
#   - markdown: mdformat + GFM plugin, honoring .mdformat.toml (105-column wrap)
#   - TOML: taplo, with dot_aerospace.toml excluded (user-preferred alignment)
#   - JSON/YAML: validation-only via jq/yq (scripts/*-validate.sh)
#   - chezmoi templates: render-then-check via scripts/ (shellcheck, osquery
#     JSON, espanso YAML)
# nixfmt is gone with the .nix files it formatted.

[global]
excludes = [
  ".direnv/**",
  ".superpowers/**",
  ".worktrees/**",
  "**/vendor/**",
  "**/.vendor/**",
  "**/node_modules/**",
]

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh", "*.bash", "dot_bash*", "dot_profile"]
excludes = ["*.tmpl"]

[formatter.shfmt]
command = "shfmt"
options = ["-i", "2", "-ci", "-s", "-w"]
includes = ["*.sh", "*.bash", "dot_bash*", "dot_profile"]
excludes = ["*.tmpl"]

# The herdr plugins are vendored under dot_local/share. That root is listed
# rather than a bare "**/*.rs", which would also sweep untracked target/ trees.
[formatter.rust-file-size]
command = "scripts/treefmt/rust-file-size.sh"
includes = ["dot_local/share/**/*.rs"]

# RULE: skill/agent/command markdown is authored prose with YAML frontmatter;
# mdformat is never allowed to touch it (see the old treefmt.nix note; the
# frontmatter plugin travels with the uv-installed mdformat, but the rule
# stands). docs/research/2026-04-12-worktrunk.md fails mdformat's round-trip
# validator; quarantined so the rest stays linted.
[formatter.mdformat]
command = "mdformat"
includes = ["*.md"]
excludes = [
  "private_dot_claude/skills/**",
  "private_dot_claude/agents/**",
  "private_dot_claude/commands/**",
  "private_dot_claude/output-styles/**",
  # Same rule one directory over: a vendored skill with YAML frontmatter, kept
  # byte-identical to its upstream so a comparison against it stays meaningful.
  "private_dot_hermes/private_skills/**",
  "docs/superpowers/**",
  "docs/research/2026-04-12-worktrunk.md",
]

# dot_aerospace.toml keeps user-preferred visual alignment taplo would strip.
# dot_config/herdr/config.toml carries the sidebar row the herdr-agent-quota
# plugin's configure action rewrites on every apply, byte for byte on one line;
# a taplo rewrap makes chezmoi's write differ from the plugin's and every apply
# then asks "has changed since chezmoi last wrote it?".
# modify_ templates share the .toml extension but hold Go template directives
# taplo cannot parse; both spellings because patterns match whole paths from the
# tree root.
[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
excludes = [
  "dot_aerospace.toml",
  "dot_config/herdr/config.toml",
  "modify_*",
  "**/modify_*",
]

[formatter.actionlint]
command = "actionlint"
includes = [".github/workflows/*.yml", ".github/workflows/*.yaml"]

# JSON validation. modify_ templates share the .json extension but hold Go
# template directives jq cannot parse; both spellings because patterns match
# whole paths from the tree root.
[formatter.jq-validate]
command = "scripts/treefmt/jq-validate.sh"
includes = ["*.json"]
excludes = ["modify_*", "**/modify_*"]

# YAML validation; workflow YAML is actionlint's. The espanso tree is
# hand-edited YAML that reaches $HOME. A .yml.tmpl is Go-template text no YAML
# parser can read; espanso-match-render below gates those.
# The two agent data files are checked together for collisions: a plugin or
# skill that would reach one harness twice, or an entry that contradicts
# itself. The script reads both files itself, whatever list it is handed.
[formatter.agent-data-validate]
command = "scripts/treefmt/agent-data-validate.sh"
includes = [".chezmoidata/agent-plugins.yaml", ".chezmoidata/agent-skills.yaml"]

[formatter.yq-validate]
command = "scripts/treefmt/yq-validate.sh"
includes = [
  ".chezmoidata/*.yaml",
  ".chezmoidata/*.yml",
  "Library/Application Support/espanso/**/*.yaml",
  "Library/Application Support/espanso/**/*.yml",
]

[formatter.espanso-match-render]
command = "scripts/treefmt/espanso-match-render.sh"
includes = [
  "Library/Application Support/espanso/**/*.yaml.tmpl",
  "Library/Application Support/espanso/**/*.yml.tmpl",
]

# Every shell template is handed over; the script classifies per file (shell?
# vault-free?) and renders + shellchecks the safe set. Replaces the nix-eval
# discovery in the old treefmt.nix.
[formatter.shellcheck-rendered-template]
command = "scripts/treefmt/shellcheck-rendered-template.sh"
includes = [".chezmoiscripts/*.sh.tmpl", "dot_*.tmpl"]

[formatter.osquery-config-render]
command = "scripts/treefmt/osquery-config-render.sh"
includes = [
  "dot_local/libexec/posture/converge/desired/*.conf",
  "dot_local/libexec/posture/converge/desired/*.conf.tmpl",
  "dot_local/libexec/posture/converge/desired/**/*.conf",
  "dot_local/libexec/posture/converge/desired/**/*.conf.tmpl",
]

# Measured on treefmt 2.5.0: the flat glob alone matches every file, direct
# child and nested alike, because its `*` crosses `/`; the doublestar glob
# alone misses the direct child. Both stay, matching the osquery-config-render
# pair above, so this table does not depend on that single-star crossing
# behavior holding on a future treefmt version.
[formatter.stylua]
command = "stylua"
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

[formatter.emmylua-check]
command = "emmylua_check"
options = ["--config", "dot_config/nvim/dot_emmyrc.json", "--severity", "error"]
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

[formatter.luacheck]
command = "luacheck"
options = ["--config", "dot_config/nvim/dot_luacheckrc"]
includes = ["dot_config/nvim/*.lua", "dot_config/nvim/**/*.lua"]

# The fzf picker suite is the hand-written Python that reaches $HOME. ruff.toml
# at the root holds its line length and the EXE001 exclusion for the
# chezmoi-prefixed entry point. Both globs, for the reason stylua gives above.
[formatter.ruff-check]
command = "ruff"
options = ["check"]
includes = [
  "dot_config/fzf-pickers/lib/*.py",
  "dot_config/fzf-pickers/lib/**/*.py",
]

[formatter.ruff-format]
command = "ruff"
options = ["format", "--check"]
includes = [
  "dot_config/fzf-pickers/lib/*.py",
  "dot_config/fzf-pickers/lib/**/*.py",
]
