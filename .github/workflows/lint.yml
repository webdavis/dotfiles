name: Lint
on:
  push:
    branches:
      - "main"
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BASHUNIT_VERSION is pinned because the runner's cached Homebrew index pours whatever
      # release it happens to hold (0.43.0 on 2026-09-05), while neotest-bashunit's fixtures
      # were measured against one exact release. The same number lives in
      # dot_local/share/neotest-bashunit/lua/neotest-bashunit/parse.lua as M.verified_version,
      # and nothing enforces that the two agree: move them together by hand, after
      # re-measuring the fixtures.
      - name: Install the lint and test toolchain (Homebrew + uv, no nix)
        env:
          BASHUNIT_VERSION: "0.50.1"
          BASHUNIT_VERIFY_CHECKSUM: "true"
        run: |
          brew install actionlint age bash bats-core chezmoi coreutils jq just luacheck neovim shellcheck shfmt stylua taplo treefmt uv yq zizmor
          uv tool install mdformat==0.7.22 --with mdformat-gfm==0.4.1 --with mdformat-gfm-alerts==2.0.0 --with mdformat-frontmatter==2.0.8 --with mdformat-footnote==0.1.1 --with mdformat-tables==1.0.0 --with mdformat-config==0.2.1
          curl -fsSL https://bashunit.typeddevs.com/install.sh | bash -s -- "$HOME/.local/bin" "$BASHUNIT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint drift gate (treefmt)
        run: just lint-check
      - name: Run the repo test suite
        run: just test
      - name: Audit GitHub Actions workflows (zizmor)
        run: just lint-actions-security
