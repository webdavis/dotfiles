    right_word: true

  - trigger: ";;fu"
    replace: "function"

  - trigger: ";;t"
    replace: "#task"
    # Fires only at word end, so ;;ty stays typeable.
    right_word: true

  - trigger: ";;#"
    replace: "#### 6pm: \n#### 7pm: \n#### 8pm: \n#### 9pm: \n"

  - trigger: "natm"
    replace: "Not at the moment."
    word: true

  - trigger: ";;ty"
    replace: "Thank you"

  - trigger: ";;pls"
    replace: "please"

  - trigger: ";;lgtm"
    replace: "Looks good to me"

