    replace: "YouTube"

  - trigger: ";;gh"
    replace: "GitHub"

  - trigger: ";;cc"
    replace: "Claude Code"

  - trigger: ";;ob"
    replace: "Obsidian"

  - trigger: ";;cg"
    replace: "ChatGPT"

  - trigger: ";;an"
    replace: "ansible"
    propagate_case: true

  - trigger: ";js"
    replace: "JavaScript"

  - trigger: ";py"
    replace: "Python"

  - trigger: ",,dt"
    replace: "{{my_datetime}}"
    vars:
      - name: my_datetime
        type: date
        params:
          format: "%Y-%m-%d %H:%M:%S"

  - trigger: ",,date"
    replace: "{{my_date}}"
    vars:
      - name: my_date
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ",,iso"
    replace: "{{my_iso_date}}"
    vars:
      - name: my_iso_date
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ",,now"
    replace: "{{my_time}}"
    vars:
      - name: my_time
        type: date
        params:
          format: "%H:%M:%S"

  - trigger: ",,day"
    replace: "{{my_day}}"
    vars:
      - name: my_day
        type: date
        params:
          format: "## %A, %Y-%m-%d:"

  - trigger: ",,ts"
    replace: "{{ts}}"
    vars:
      - name: ts
        type: shell
        params:
          cmd: "date +%s"

  - trigger: ",,cb"
    replace: "```\n$|$\n```"

  - trigger: ",,tu"
    replace: "👍"

  - trigger: ",,et"
    replace: "every time"
    propagate_case: true

  - trigger: ",,df"
    replace: "difference"

  - trigger: ",,com"
