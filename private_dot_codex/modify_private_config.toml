{{- /* chezmoi:modify-template */ -}}
{{- /* Codex rewrites this file while it runs, so this merges declared fields into the live file. */ -}}
{{- /* [hooks.state] stays as the live file has it: hook trust is granted at the Codex prompt alone. */ -}}
{{- /* Safe access keeps this renderable under `chezmoi execute-template`; a no-op apply emits $raw. */ -}}
{{- $raw := index .chezmoi "stdin" | default "" -}}
{{- $stdin := $raw | trim -}}
{{- $merged := fromToml $stdin -}}
{{- $home := .chezmoi.homeDir -}}
{{- $d := includeTemplate "agent-derived.json.tmpl" . | fromJson -}}

{{- $merged = setValueAtPath "model" "gpt-6-astra" $merged -}}
{{- $merged = setValueAtPath "model_reasoning_effort" "ultra" $merged -}}
{{- $merged = setValueAtPath "personality" "pragmatic" $merged -}}
{{- $merged = setValueAtPath "service_tier" "default" $merged -}}

{{- /* Asserted every apply, so the sandbox holds whatever Codex writes at runtime. */ -}}
{{- $merged = setValueAtPath "sandbox_mode" "workspace-write" $merged -}}
{{- $merged = setValueAtPath "approval_policy" "on-request" $merged -}}
{{- $merged = setValueAtPath "approvals_reviewer" "guardian_subagent" $merged -}}

{{- $merged = setValueAtPath "notify" (list
    (printf "%s/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient" $home)
    "turn-ended") $merged -}}

{{- /* Per key, so a feature Codex adds later keeps the value Codex gave it. */ -}}
{{- $merged = setValueAtPath "features.hooks" true $merged -}}
{{- $merged = setValueAtPath "features.memories" true $merged -}}
{{- $merged = setValueAtPath "features.network_proxy" true $merged -}}
{{- $merged = setValueAtPath "features.prevent_idle_sleep" true $merged -}}
{{- $merged = setValueAtPath "features.worktrees" true $merged -}}
{{- $merged = setValueAtPath "features.js_repl" false $merged -}}
{{- $merged = setValueAtPath "memories.generate_memories" true $merged -}}
{{- $merged = setValueAtPath "memories.use_memories" true $merged -}}

{{- /* Per key, so Codex's onboarding counters under tui stay live. */ -}}
{{- $merged = setValueAtPath "tui.vim_mode_default" true $merged -}}

{{- /* Whole entries, since Codex rejects a server missing its command or url. */ -}}
{{- $merged = setValueAtPath (list "mcp_servers" "workspace-mcp" "command") "uvx" $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "workspace-mcp" "args") (list "workspace-mcp" "--tool-tier" "complete") $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "workspace-mcp" "env" "GOOGLE_OAUTH_CLIENT_ID") (keepassxc "Google Cloud (webdavis) :: OAuth (google-workspace-mcp)").UserName $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "workspace-mcp" "env" "GOOGLE_OAUTH_CLIENT_SECRET") (keepassxc "Google Cloud (webdavis) :: OAuth (google-workspace-mcp)").Password $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "workspace-mcp" "env" "OAUTHLIB_INSECURE_TRANSPORT") "1" $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "cua-driver" "command") (printf "%s/.local/bin/cua-driver" $home) $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "cua-driver" "args") (list "mcp") $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "codegraph" "command") "codegraph" $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "codegraph" "args") (list "serve" "--mcp") $merged -}}
{{- $merged = setValueAtPath (list "mcp_servers" "scalebar" "command") (printf "%s/%s/ScalebarMCP" $home .packages.source_builds.scalebar.install_dir) $merged -}}
{{- /* Codex passes TMPDIR but not XDG_RUNTIME_DIR, where nvim-mcp looks for Neovim's socket first. */ -}}
{{- /* Codex reads tools once per session, so they are listed before a Neovim opens. */ -}}
{{- $merged = setValueAtPath (list "mcp_servers" "nvim")
    (dict
      "command" "nvim-mcp"
      "args" (list "--connect" "auto" "--always-expose-connection-tools")
      "env_vars" (list "XDG_RUNTIME_DIR")) $merged -}}

{{- /* The fallback flag makes the server read its keys from this map alone, and the whole map is written each apply. */ -}}
{{- $merged = setValueAtPath (list "mcp_servers" "ynab")
    (dict
      "command" (printf "%s/.local/share/fnm/aliases/default/bin/mcp-server-for-ynab" $home)
      "env" (dict
        "YNAB_ALLOW_WRITES" "1"
        "YNAB_DISABLE_AGENT_CONFIG_FALLBACK" "1"
        "YNAB_API_TOKEN" (keepassxc "YNAB :: Personal Access Token").Password)) $merged -}}

{{- /* Live entries stay, so a root trusted at the Codex prompt survives an apply. */ -}}
{{- $declaredProjects := list
    (printf "%s/workspaces/Ivy" $home)
    (printf "%s/workspaces/Ivy/webdavis/dotfiles" $home)
    (printf "%s/workspaces/Ivy/webdavis/homelab" $home)
    (printf "%s/workspaces/webdavis/uriel" $home)
    (printf "%s/.hermes/skills" $home) -}}
{{- /* `projects` is absent on a fresh machine, and `index` on nil errors. */ -}}
{{- $projects := dict -}}
{{- if eq (kindOf (index $merged "projects")) "map" -}}
{{-   $projects = index $merged "projects" -}}
{{- end -}}
{{- range $projectPath := $declaredProjects -}}
{{-   $entry := index $projects $projectPath -}}
{{-   if ne (kindOf $entry) "map" -}}
{{-     $entry = dict -}}
{{-   end -}}
{{-   $projects = set $projects $projectPath (set $entry "trust_level" "trusted") -}}
{{- end -}}
{{- $merged = set $merged "projects" $projects -}}

{{- /* A no-op apply emits the live file unchanged, since toToml reorders every key. */ -}}
{{- /* The check uses a fresh parse because setValueAtPath mutates the map it gets. */ -}}
{{- if deepEqual $merged (fromToml $stdin) -}}
{{- $raw -}}
{{- else -}}
{{ $merged | toToml }}
{{- end -}}
