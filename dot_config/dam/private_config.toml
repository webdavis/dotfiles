# dam (webdavis/damnit), the task CLI.
#
# The token is an indirection: this file names the source it comes from and
# never holds the value.
#
# MEASURED 2026-09-18 (herdr-todoist, the same pattern): a helper spawned
# with stdin closed can never resolve a keepassxc-cli prompt, so the macOS
# keychain is read non-interactively instead; KeePassXC stays the entry of
# record. One-time operator setup:
#   security add-generic-password -a "$USER" -s 'Todoist API Token' -w
[remote.todoist]
url = "todoist::"
api_token_command = [
  "security",
  "find-generic-password",
  "-w",
  "-s",
  "Todoist API Token",
]
stale = "15m"
deadline = "60s"
