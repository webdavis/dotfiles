# One folder holds every worktree, whichever tool makes it.
worktree-path = "~/workspaces/.worktrees/{{ repo }}/{{ branch | sanitize }}"

# Gives haiku a thinking budget for branch summaries and commit messages alike.
[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=16000 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[commit]
stage = "tracked"

[merge]
squash = false
rebase = true
remove = true
verify = true

[remove]
delete-branch = true

[list]
summary = false
# Bounds the Herdr picker's wait; raise it if status comes back incomplete.
timeout-ms = 1000

[switch.picker]
pager = "delta --paging=never"

[post-start]
copy = "wt step copy-ignored"

[post-remove]
close-herdr-panes = "herdr-close-removed-worktree.sh '{{ worktree_path }}'"

[aliases]
up = "git fetch --all --prune && wt step for-each -- 'git rev-parse --verify -q @{u} >/dev/null || exit 0; g=$(git rev-parse --git-dir); test -d \"$g/rebase-merge\" -o -d \"$g/rebase-apply\" && exit 0; git rebase @{u} --no-autostash || { git rebase --abort; echo \"wt up: rebase failed for $(git branch --show-current); left unchanged\" >&2; }'"
