# Shell key bindings, written once and rendered into each shell's own syntax
# by `chord render <shell> --table <this file>`. Today `bash` is the only
# shell; `just chord-render` regenerates `dot_bash_bindings` from this file.
#
# A key is space-separated tokens, each one of:
#   ctrl-<char>   alt-<char>   esc   enter   tab   space   backspace
# or a single literal character. So `ctrl-g a a` is Ctrl-G then a then a.
#
# A row names exactly one action:
#   insert = "text"       type the text and leave it on the line for editing
#   run = "text"          type the text and run it
#   function = "name"     call a shell function (readline's `bind -x`)
#   command = "name"      run a readline command, such as beginning-of-line
#   macro = "body"        a readline macro body in readline's own escapes,
#                         emitted verbatim, for the chords the kinds above
#                         cannot express
#
# `modes` lists the editing modes the row binds in. Left out it means both vi
# modes, where the command-mode binding enters insert mode first. An empty
# list binds in whatever keymap is current, with no mode flag at all.
#
# The shell functions these rows call live in `dot_bash_bindings_functions`.

# The `[render]` section is what each rendered file says about itself: where it
# goes, the comment block it opens with, the readline macro a typed row clears
# the line with, and the command that regenerates it, which a failed
# `chord check` names. An `output` path is read from the working directory, so
# these two are relative to the repository root.

[render]
regenerate = "just chord-render"

[render.bash]
output = "dot_bash_bindings"
clear_line = "\\C-x0"
header = '''
# vi:filetype=sh shiftwidth=2 softtabstop=2 tabstop=8:

# shellcheck shell=bash

# Disable SC2016 (which warns about expressions in single quotes):
# shellcheck disable=SC2016

# GENERATED FILE: `chord render bash` over `dot_config/chord/bindings.toml`.
# Edit the table and regenerate with `just chord-render`; a hand edit here
# fails `just test-rust`.
#
# The shell functions these bindings call, and the `\C-x0`, `\C-x1` and
# `\C-x2` helper macros, live in ~/.bash_bindings_functions, which
# ~/.bashrc sources first.
'''

[render.menu]
output = "dot_config/chord/bindings-menu.tsv"
header = '''
# GENERATED FILE: `chord render menu` over `dot_config/chord/bindings.toml`.
# Edit the table and regenerate with `just chord-render`; a hand edit here
# fails `just test-rust`.
#
'''

