{{- /* chezmoi:modify-template */ -}}
{{- /*
  Selective field control for ~/.config/herdr/config.toml.

  Why: herdr and the operator both rewrite this file at runtime (the settings
  screens behind `prefix+u`, live keybinding edits, `reload_config`). A plain
  chezmoi target forces the exact committed bytes back onto the live file on
  every apply, which has already erased an operator edit that had not yet been
  committed (the clauth block, 2026-09-17). This is the same problem
  dot_clauth/modify_private_profiles.toml solves for ~/.clauth/profiles.toml,
  applied here.

  How: the declared content lives in
  .chezmoitemplates/herdr-config-declared.toml.tmpl, byte-for-byte what this
  target used to be as a plain file. It is parsed with fromToml and deep-merged
  over the live file (also parsed with fromToml) using sprig's mergeOverwrite,
  which recurses into nested tables:

    DECLARED    any key this repo's partial sets, at any depth, is forced to
                the partial's value on every apply: [update], [terminal],
                [theme], [ui], [experimental], every [keys] scalar, the whole
                [[keys.command]] array (arrays are atomic, so this repo's own
                keybindings always win over a live-only reordering or edit),
                and the [ui.sidebar.agents] rows the repo names, including the
                rows_by_agent.claude row this repo wrote for clauth.
    FREE-DRIFT  any key the live file has that the partial does not mention, at
                any depth, survives untouched. A new
                [ui.sidebar.agents.rows_by_agent.<agent>] table the operator or
                a plugin adds for an agent this repo has not declared a row
                for is the case this exists for.

  A NO-OP APPLY IS QUIET. When the merge changes nothing, the live file is
  emitted back byte for byte, the same technique the clauth and Codex templates
  use, because `toToml` sorts keys and reformats where the live file (or this
  repo's own hand-formatted partial, box-drawing headers included) does not,
  and an unconditional rewrite would print a diff on every apply. Re-serializing
  DOES lose the partial's comments in the deployed file, the same trade the
  Codex and clauth templates already make; the comments stay for readability in
  this repo's own copy.

  KNOWN LIMIT: this is a per-value merge, not a per-array-entry merge. A live
  edit to a scalar or table this repo already declares (say, a hand-tweaked
  `row_gap`) still reverts on the next apply, same as every other field a
  STABLE tier enforces elsewhere in this repo. Only genuinely new keys survive.

  A live file that is non-empty and does not parse aborts the WHOLE apply from
  here, same as the clauth template and for the same reason: `fromToml` hard
  errors and text/template cannot recover. An empty or whitespace-only file
  seeds from the declared partial alone, the first-apply case.
--- */ -}}

{{- $raw := .chezmoi.stdin -}}
{{- $live := dict -}}
{{- if ne (trim $raw) "" -}}
{{-   $live = fromToml $raw -}}
{{- end -}}
{{- $declared := fromToml (includeTemplate "herdr-config-declared.toml.tmpl") -}}
{{- $merged := mergeOverwrite (dict) $live $declared -}}

{{- if and (ne (trim $raw) "") (deepEqual $merged $live) -}}
{{- $raw -}}
{{- else -}}
{{ $merged | toToml }}
{{- end -}}
