[windows.tuicr]
program = "tuicr"
cwd = "~/workspaces/Ivy/webdavis/dotfiles"
width = "85%"
height = "85%"
ctrl_c = "hide"

# `resume` reuses the recorded worktree, so each toggle returns to the same review.
# cwd picks which repository's worktrees the picker lists.
[windows.review]
program = "worktree-review.sh"
args = ["resume"]
cwd = "~/workspaces/Ivy/webdavis/dotfiles"
width = "90%"
height = "90%"
ctrl_c = "hide"
