# A third of the tab leaves the rest for the pane being worked in.
width = 0.3

default_view = "today"

# Queries use dam's grammar.
[[views]]
name = "today"
query = "!done & (due:today | overdue)"

# dam names the Todoist project webdavis > dotfiles by this path.
[[views]]
name = "dotfiles"
query = "!done & path:webdavis/dotfiles/"
