onboarding = false

[update]
channel = "stable"

[terminal]
default_shell = "bash"
shell_mode = "auto"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sound]
enabled = true

[ui.sound.agents]
droid = "on"

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "machine", "workspace", "tab"]]

[experimental]
pane_history = true
# Switches macOS input to ASCII in prefix mode so chords register under a CJK IME.
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "ctrl+d"

# The key picks the group and the modifier the verb: go, shift moves, alt renames, ctrl creates.

# Windows are herdr tabs; prefix+n/p are herdr's defaults.
switch_tab = "prefix+1..9"
move_tab_next = "prefix+shift+n"
move_tab_previous = "prefix+shift+p"
rename_tab = ["prefix+alt+n", "prefix+,"]
new_tab = "prefix+ctrl+n"

# Spaces are herdr workspaces; the [ chords need CSI-u key reporting.
next_workspace = "prefix+]"
previous_workspace = "prefix+["
switch_workspace = ["prefix+alt+1..9", "alt+1..9"]
rename_workspace = ["prefix+alt+[", "prefix+ctrl+,"]
new_workspace = "prefix+ctrl+["

# Splits keep the tmux keys.
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
rename_pane = ["prefix+alt+h", "prefix+shift+,"]
split_horizontal = "prefix+\""
split_vertical = "prefix+%"
zoom = "prefix+="
last_pane = "prefix+\\"

next_agent = "prefix+j"
previous_agent = "prefix+k"
focus_agent = ["prefix+ctrl+1..9", "ctrl+1..9"]

# x closes, and the modifier picks the size; worktrunk's chord closes a worktree.
close_workspace = "prefix+alt+x"

goto = "prefix+g"
workspace_picker = "prefix+shift+o"
copy_mode = "prefix+c"
edit_scrollback = "prefix+alt+e"
reload_config = "prefix+shift+r"

# worktrunk's chords cover these.
new_worktree = ""
open_worktree = ""
remove_worktree = ""

navigate_workspace_up = "ctrl+p"
navigate_workspace_down = "ctrl+n"

[[keys.command]]
key = "prefix+ctrl+\\"
type = "plugin_action"
command = "herdr-picker.last_workspace"
description = "last workspace (MRU toggle)"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-picker.pick"
description = "pick a workspace"

# Runs the dev build to preview a look change before it is pushed.
[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "~/workspaces/Ivy/webdavis/herdr-picker/target/release/herdr-picker pick"
description = "pick a workspace (dev build)"
width = 40
height = 13

[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "herdr-picker.launch_ctrl_t"
description = "pickers on ctrl-t over this pane"

[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "herdr-picker.launch_ctrl_g"
description = "pickers on ctrl-g over this pane"

# Moves across Neovim splits and herdr panes as if they were one set of panes.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-smart-nav.nav_left"
description = "nav left: Neovim split or herdr pane"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-smart-nav.nav_down"
description = "nav down: Neovim split or herdr pane"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-smart-nav.nav_up"
description = "nav up: Neovim split or herdr pane"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-smart-nav.nav_right"
description = "nav right: Neovim split or herdr pane"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "$HERDR_BIN_PATH pane send-keys $HERDR_ACTIVE_PANE_ID 'ctrl+l'"
description = "clear screen: send Ctrl-l to the focused pane (like bash)"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch or create from the default branch"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: switch or create from the current branch"

[[keys.command]]
key = "prefix+ctrl+w"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "worktree: switch or create from local or remote branches"

[[keys.command]]
key = "prefix+ctrl+x"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktree: remove"

[[keys.command]]
key = "prefix+ctrl+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "worktree: merge into the target branch"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate: comment on selected text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.last"
description = "annotate: review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review documents in the current folder"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.manage"
description = "annotate: manage annotations"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "annotate.copy-context"
description = "annotate: copy annotations as context"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "annotate.copy-archive"
description = "annotate: copy annotations as context and archive them"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar: toggle"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "nvim sidebar: open file from agent output"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle the code-review pane"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "herdr-process.tuicr:toggle-float"
description = "tuicr: toggle floating window"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "herdr-process.review:toggle-float"
description = "worktree review: toggle floating window"

# Ends the session, so the next toggle reviews the worktree `worktree-review.sh pick` recorded.
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "herdr-process.review:kill"
description = "worktree review: end the session (re-pick with worktree-review.sh pick)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "tab-smart-rename.rename-now"
description = "smart rename: the current tab"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "tab-smart-rename.rename-all"
description = "smart rename: every tab"

# >>> furkankly.zoetrope keys (managed: `setup-keys` writes this block, `remove-keys` deletes it)
[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# Inside the markers, so remove-keys deletes both bindings together.
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open-tab"
description = "zoetrope: session graph (tab)"

# <<< furkankly.zoetrope keys

[[keys.command]]
key = "prefix+@"
type = "plugin_action"
command = "clauth.open"
description = "clauth: manage accounts"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-damnit.toggle"
description = "damnit: toggle the task pane"

# The status screen gets its own chord because staging is why the plugin exists.
[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "herdr-damnit.status"
description = "damnit: open the pane on the status screen"

# `$clauth` and `$clauth_delegate` mean something on Claude Code panes alone, so those get their own rows.
[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    "terminal_title_stripped",
  ],
  [
    "agent",
    "$clauth",
    "$clauth_delegate",
  ],
]
