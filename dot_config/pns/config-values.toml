# The one committed input to `just pns-config-render`, which turns this
# into `dot_config/pns/private_config.toml.tmpl`. NEVER A SECRET VALUE: a
# secret-bearing key holds a table naming the keepassxc entry and field
# instead, `{ keepassxc = "<entry>", field = "Password" | "UserName" }`, and
# the generator refuses to write when one of those five keys holds anything
# else.
#
# ABSENCE IS NOT NEUTRAL. A table this file never mentions renders commented
# (an opt-in feature nobody armed yet); a key this file never mentions
# renders at its schema default. Every table and key below is here because
# the shipped template has it live at a value other than that default, or
# because it is a secret. See `pns/crates/pns-adapters/src/config/render/layout.rs`
# (`LAYOUT`) for the schema this is walked against.

# EVERY `enabled` REACHES THE RENDERED FILE at its own default, `[gateway]`
# true and every `[plugins.*]` false, so no table's switch has to be
# inferred. A plugin this machine actually runs therefore states the switch
# below; that line is the whole reason its table is here.

# The launchd label `pns gateway start|stop|restart|status` acts on: the same
# one Library/LaunchAgents/com.webdavis.pns-daemon.plist.tmpl and
# run_onchange_after_70-load-pns-daemon-launchagent.sh.tmpl install the clock
# under.
[gateway]
service = "com.webdavis.pns-daemon"

# The three classes this machine serves, which is the whole statement of
# which words a producer may send: pns compiles in none, and a class no table
# here defines is refused rather than delivered somewhere unintended.
#
# `default` is the rule for a message naming no class, which is every harness
# hook and the shell notifier: the routine route, and the mute respected.
[delivery_class.default]
route = ""
bypass_mute = false

# uu sends this on its weekly upgrade run, and pns's own stale-block
# escalation carries it. `priority` is the same route [routes] urgent names,
# and it is taken only while somebody is waiting on the event, so an upgrade
# that went fine stays on the routine route.
[delivery_class.health]
note = """
uu sends this on its weekly upgrade run, and pns's own stale-block escalation
carries it."""
route = "priority"
bypass_mute = false

# posture sends this on a security finding. It names its own route
# (posture-pages), so this table adds the one thing posture cannot: a finding
# crosses a timed mute and a named Focus mode.
[delivery_class.security]
note = """
posture sends this on a security finding. It names its own route, so this
table adds the one thing posture cannot: crossing a mute."""
route = ""
bypass_mute = true

[plugins.phone]
enabled = true
device_token = { keepassxc = "moshi-hook :: Device Token", field = "Password" }

# The banner this machine raises for itself. ONE KEY, the switch: every other
# banner setting is at its layout default here.
[plugins.banner]
enabled = true

# The durable paper trail. ONE TABLE, so two of them cannot be declared: the
# rendered `type` names which transport carries it, and the credentials for
# the other one sit here ready, which makes the cutover that single line and
# the rollback the same line back.
[plugins.log]
enabled = true
bot_token = { keepassxc = "Discord (Uriel) :: Bot Token (pns)", field = "Password" }

# One key per hermes route, so a key leaked from any route cannot post to
# every route. A route left out here posts nothing and says which key is
# missing, rather than borrowing another route's secret.
#
# THESE KEYS ARE THE ROSTER. pns compiles in no list of routes, so this table
# is the whole statement of which routes this machine posts to: `pns-events`
# and `priority` are the two names the `[routes]` table carries in the
# rendered file, and `posture-pages` exists here because posture submits
# pages under that name and nowhere in pns. Every key here is a route name,
# `note` included, so this table takes no comment of its own.
[plugins.log.keys]
pns-events = { keepassxc = "Hermes :: Webhook Secret (#pns-events)", field = "Password" }
posture-pages = { keepassxc = "Hermes :: Webhook Secret (#posture-pages)", field = "Password" }
priority = { keepassxc = "Hermes :: Webhook Secret (#priority)", field = "Password" }

# One entry per project, plus the two fallbacks and the severity channel, read
# only while the log's `type` is discord. A channel id is a secret like every
# other id here, so every entry NAMES its vault record rather than writing the
# id into a committed file.
#
# `priority` is what a critical page carries whatever project it was about,
# `pns-events` is where an event with no project at all lands, and `default`
# is the catch-all for a project nobody mapped. A repository that needs its
# own channel under its full name is one more line, keyed `owner/name`.
[plugins.log.channels]
default = { keepassxc = "Discord (Uriel) :: Channel ID (#github-notifications)", field = "Password" }
pns-events = { keepassxc = "Discord (Uriel) :: Channel ID (#pns-events)", field = "Password" }
priority = { keepassxc = "Discord (Uriel) :: Channel ID (#priority)", field = "Password" }
posture-pages = { keepassxc = "Discord (Uriel) :: Channel ID (#posture-pages)", field = "Password" }
casually-concerned = { keepassxc = "Discord (Uriel) :: Channel ID (#casually-concerned-dev)", field = "Password" }
dotfiles = { keepassxc = "Discord (Uriel) :: Channel ID (#dotfiles-dev)", field = "Password" }
essential-feed-case-study = { keepassxc = "Discord (Uriel) :: Channel ID (#essential-feed-case-study-dev)", field = "Password" }
homelab = { keepassxc = "Discord (Uriel) :: Channel ID (#homelab-dev)", field = "Password" }
justdavis-ansible = { keepassxc = "Discord (Uriel) :: Channel ID (#justdavis-ansible-dev)", field = "Password" }
netpulse = { keepassxc = "Discord (Uriel) :: Channel ID (#netpulse-dev)", field = "Password" }
plantpulse = { keepassxc = "Discord (Uriel) :: Channel ID (#plantpulse-dev)", field = "Password" }
pns = { keepassxc = "Discord (Uriel) :: Channel ID (#pns-dev)", field = "Password" }
posture = { keepassxc = "Discord (Uriel) :: Channel ID (#posture-dev)", field = "Password" }
scalebar = { keepassxc = "Discord (Uriel) :: Channel ID (#scalebar-dev)", field = "Password" }
uu = { keepassxc = "Discord (Uriel) :: Channel ID (#uu-dev)", field = "Password" }

# The certificate is a CUSTOM ATTRIBUTE on the same vault entry as the bridge
# and key, beside them rather than in a committed literal: this repository is
# public, and its own rule already treats an id as a vault reference. Produce
# the value with `pns lights enroll` on the machine and save the line it
# prints onto that entry as the attribute named here.
[plugins.lights]
enabled = true
bridge_host = { keepassxc = "OpenHue :: API Key (hue-bridge-pro)", field = "UserName" }
certificate = { keepassxc = "OpenHue :: API Key (hue-bridge-pro)", attribute = "certificate-pin" }
api_key = { keepassxc = "OpenHue :: API Key (hue-bridge-pro)", field = "Password" }

# ARMED WITH THE TOKEN AND NOTHING ELSE. `poll_interval` ships at the layout
# default ("60s"), which is what the notifications API's own X-Poll-Interval
# header asks for today; from the first answer onwards the header decides and
# this key is only the figure used before it.
[plugins.github]
enabled = true
personal_access_token = { keepassxc = "GitHub (Webdavis) :: Personal Access Token (pns notifications)", field = "Password" }

[plugins.presence]
enabled = true
type = "hue"
rooms = ["3F - Studio", "2F - Kitchen", "3F - MBedroom"]
excluded_rooms = []
desk_room = "3F - Studio"

[plugins.home_presence]
enabled = true
url = "https://192.168.1.1"
device_hostname = "mister"
api_key = { keepassxc = "UniFi :: API Key (dresden-udr)", field = "Password" }

# No reference implementer exists yet; the Rust replacement is a pending PR.
# `command` names a script the operator places by hand at the path below. An
# absolute path rather than the bare name the shipped example shows, because
# the daemon's own PATH (com.webdavis.pns-daemon.plist.tmpl) carries
# ~/.local/bin and /opt/homebrew/bin but not ~/.local/libexec/pns, and pns
# spawns argv[0] through no shell, so a bare name here would never resolve;
# the literal home is fine on that basis too, this machine is single-user.
# poll_interval and deadline stay at their layout defaults.
#
# enabled stays false until a live run against the real gog token is proven:
# `gog auth list` currently times out opening the login keychain item
# (macOS wants an interactive "Always Allow" click to clear it) and account
# resolution has never succeeded on this machine. Flip to true once the
# script at the path below prints the documented document by hand.
[quiet.calendar]
enabled = false
command = ["/Users/stephen/.local/libexec/pns/calendar-busy-window.sh"]

[profiles.default]
note = """
Today's behaviour, which is also what a machine with no profiles at all
has."""
quiet = false
banner = "all"
discord = "all"
phone = "all"
lights = "all"

[profiles.work]
note = """
At the desk on somebody else's clock: the screen in front of you still
talks, the phone and Discord only for a page, and nothing else posts or
pulses."""
quiet = true
banner = "all"
discord = "priority"
phone = "priority"
lights = "none"

[profiles.night]
note = """
Asleep. Only a page gets through, on the phone and in Discord, and
everything else is held and delivered as one roll-up when the profile
next admits it."""
quiet = true
banner = "none"
discord = "priority"
phone = "priority"
lights = "none"

[[profiles.rules]]
profile = "night"
hours = "22:00-06:00"

[[profiles.rules]]
profile = "work"
days = ["Mon", "Tue", "Wed", "Thu", "Fri"]
hours = "09:00-17:00"

# "5m" is the layout default and the operator's real setting, written out
# because a table states its settings rather than arming them by being here.
[remind]
delay = "5m"

# THE HOUSE DIM WINDOW: every place below that states no `dim_window` of its
# own runs this one, and it is also what a bare `pns lights mute` lasts until.
[lights]
dim_window = "22:00-07:00"

# The one lamp knob that differs from its layout default ("5m").
[lights.loop]
arm_after = "6m"

[lights.room."3F - Studio"]
behaviours = ["done", "failed"]
dim_behaviours = ["blocked", "unseen", "loop", "checks"]

[lights.lamp."3F - Studio - HCL2"]
behaviours = ["checks"]

[lights.lamp."3F - Studio - HCL3"]
behaviours = ["loop", "blocked", "unseen"]

[lights.room."3F - MBedroom"]
behaviours = ["done", "failed"]
dim_behaviours = []

[lights.lamp."3F - MBedroom - HCL2"]
behaviours = ["checks"]

[lights.lamp."3F - MBedroom - HCL3"]
behaviours = ["loop", "blocked", "unseen"]

[lights.room."2F - Kitchen"]
behaviours = ["done", "failed"]
dim_behaviours = ["blocked", "unseen", "loop", "checks"]

[lights.lamp."2F - Kitchen - HCD5"]
behaviours = ["checks"]

[lights.lamp."2F - Kitchen - HCD6"]
behaviours = ["loop", "blocked", "unseen"]

[lights.lamp."1F - Front door - HCL1"]
behaviours = ["loop", "blocked", "unseen"]
dim_behaviours = ["blocked", "unseen", "loop"]

# The two list sections this machine fills. `pull_requests` and `commits` stay
# unnamed: the open pull requests reach the operator through the GitHub
# notification source already, and hand-made commits are not what this machine
# does. A source is an ARGV LIST run directly, one row per line of output.
[recap.sources]
# Today's tasks, through the Todoist CLI, which carries its own credentials;
# pns never reads a token. One line per task (its priority, then its first
# line), so the row cap spends itself on tasks rather than on td's multi-line
# human format.
tasks = [
  "bash",
  "-c",
  'td --no-spinner today --ndjson | jq -r "$1"',
  "_",
  '"p\(5 - .priority) " + (.content | split("\n")[0])',
]
# Whether an apply is owed, out of the transcript `just a` writes: the
# repository state the last apply ran against and how it ended.
applies = [
  "bash",
  "-c",
  'grep -E "^(head|branch|result|exit_code):" "$HOME/.local/state/chezmoi-apply/latest.apply.log" 2>/dev/null || true',
]
