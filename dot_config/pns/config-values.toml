# The one committed input to `just pns-config-render`, which turns this
# into `dot_config/pns/private_config.toml.tmpl`. NEVER A SECRET VALUE: a
# secret-bearing key holds a table naming the keepassxc entry and field
# instead, `{ keepassxc = "<entry>", field = "Password" | "UserName" }`, and
# the generator refuses to write when one of those five keys holds anything
# else.
#
# ABSENCE IS NOT NEUTRAL. A table this file never mentions renders commented
# (an opt-in feature nobody armed yet); a key this file never mentions
# renders at its schema default. Every table and key below is here because
# the shipped template has it live at a value other than that default, or
# because it is a secret. See `dot_local/share/pns/src/config_text.rs`
# (`LAYOUT`) for the schema this is walked against.

[plugins.mobile]
token = { keepassxc = "Moshi :: Webhook Secret", field = "Password" }

[plugins.hermes]
key = { keepassxc = "Hermes :: Webhook Secret :: #pns", field = "Password" }

[plugins.hue]
bridge = { keepassxc = "OpenHue :: API Key (hue-bridge-pro)", field = "UserName" }
key = { keepassxc = "OpenHue :: API Key (hue-bridge-pro)", field = "Password" }
rooms = ["3F - Studio", "2F - Kitchen"]
quiet_hours = "22:00-07:00"

[plugins.router]
router_url = "https://192.168.1.1"
device_hostname = "mister"
api_key = { keepassxc = "UniFi :: API Key (dresden-udr)", field = "Password" }

# Empty on purpose: an opt-in table's mere presence is what keeps its
# defaults live rather than commented, and 300 (the layout default) is the
# operator's real setting.
[nag]

# The one lamp knob that differs from its layout default (300).
[lights.loop]
threshold_secs = 360

[lights.room."3F - Studio"]
shows = ["done", "failed"]
dim_window = "22:00-07:00"
dim_behaviours = ["blocked", "unread", "loop"]

[lights.lamp."3F - Studio - HCL3"]
shows = ["loop", "blocked", "unread"]

[lights.room."3F - Master Bedroom"]
shows = ["done", "failed"]
dim_window = "22:00-07:00"
dim_behaviours = []

[lights.lamp."3F - Master Bedroom - HCL3"]
shows = ["loop", "blocked", "unread"]

[lights.room."2F - Kitchen"]
shows = ["done", "failed"]
dim_window = "22:00-07:00"
dim_behaviours = ["blocked", "unread", "loop"]

[lights.lamp."2F - Kitchen - HCD6"]
shows = ["loop", "blocked", "unread", "done", "failed"]

[lights.lamp."1F - Front door - HCL1"]
shows = ["loop", "blocked", "unread"]
dim_window = "22:00-07:00"
dim_behaviours = ["blocked", "unread", "loop"]
