[package]
name = "lights-adapters"
version.workspace = true
edition.workspace = true

[dependencies]
lights-protocol = { path = "../lights-protocol" }
lights-application = { path = "../lights-application" }
# The one dependency taken for a system FACT rather than a format, matching
# pns and uu: std answers neither "which minute of the local day is this
# second" (`localtime_r`) nor the zone rules behind it.
libc = "0.2.189"
serde_json = "1.0.151"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
lights-domain = { path = "../lights-domain" }
toml = { version = "1.1.4", default-features = false, features = [
  "display",
  "parse",
  "serde",
  "std",
] }
