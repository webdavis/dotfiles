[package]
name = "lights-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lights"
path = "src/main.rs"

[dependencies]
lights-application = { path = "../lights-application" }
lights-adapters = { path = "../lights-adapters" }
lights-domain = { path = "../lights-domain" }
lights-protocol = { path = "../lights-protocol" }

[dev-dependencies]
serde_json = "1.0.151"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
