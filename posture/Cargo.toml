# posture: the Rust port of this machine's osquery security pipeline.
#
# THE WORKSPACE. Five crates, one binary named `posture`, one lock. Member
# manifests declare the inward edges; domain and application cannot import
# an adapter or a wire codec they do not depend on.
#
#   posture-application -> posture-domain
#   posture-protocol    -> no dependencies until its codec lands in PR 2.4
#   posture-adapters    -> posture-application, posture-domain,
#                          posture-protocol, posture-pns-wire
#   posture         -> posture-adapters, posture-application, posture-domain
#
# posture-protocol owns the existing digest record shared by the alert and
# digest processes. PR 2.4 implements its unchanged six-field wire codec;
# this foundation declares the boundary only. posture-pns-wire is posture's
# OWN copy of the notification envelopes pns defines, consumed only by
# posture-adapters. It is a copy rather than a dependency because posture and
# pns ship as separate projects and neither may compile against the other.
#
# WHAT THIS BINARY IS ALLOWED TO SPAWN is a closed roster, stated in the plan's
# section 2.6 and enforced adapter by adapter as each one lands. Today the
# binary implements enrich and allowlist curation. Inspection uses codesign, plutil,
# xattr, file and osqueryi; publication invokes chezmoi and the owned manifest runner
# through bash. Every child has an explicit deadline. Other subcommands exit 2.
#
# The release profile is what the builder installs and what the manifest audit
# hashes. The audit refuses a file over 8 MiB, so the profile is tuned for size
# and the builder measures the artifact against that bound before installing.
[workspace]
resolver = "3"
members = [
  "crates/posture-adapters",
  "crates/posture-application",
  "crates/posture",
  "crates/posture-domain",
  "crates/posture-pns-wire",
  "crates/posture-protocol",
]
default-members = ["crates/posture"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
