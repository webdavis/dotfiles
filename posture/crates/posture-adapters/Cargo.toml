# posture-adapters: everything concrete, organized by the capability it provides.
#
# Depends inward only: on the ports in posture-application, the policy types in
# posture-domain, the digest record codec in posture-protocol, and pns's wire
# contract in pns-protocol. Only this crate consumes either protocol; it maps
# wire records to typed domain values. posture composes the adapters.
#
# pns-protocol is a PATH dependency on the sibling source tree: the relative
# path climbs out of this member and into the `pns` workspace beside `posture`
# at the monorepo root. Neither tree deploys to $HOME any more; the builder
# compiles both out of this checkout, and hashes that crate as a build input
# for the same reason.

[package]
name = "posture-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
pns-protocol = { path = "../../../pns/crates/pns-protocol" }
posture-application = { path = "../posture-application" }
posture-domain = { path = "../posture-domain" }
posture-protocol = { path = "../posture-protocol" }
libc = "0.2.189"
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde = "1.0.229"
sha2 = "0.11.0"
