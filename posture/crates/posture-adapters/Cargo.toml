# posture-adapters: everything concrete, organized by the capability it provides.
#
# Depends inward only: on the ports in posture-application, the policy types in
# posture-domain, and the digest record codec in posture-protocol. Only this
# crate consumes any protocol; it maps wire records to typed domain values, and
# `src/wire/` holds posture's own reading of the producer API's two documents.
# posture composes the adapters.
#
# EVERY DEPENDENCY HERE STAYS INSIDE THIS WORKSPACE. The producer API is spoken
# rather than imported: a path climbing out of this member and into a sibling
# engine's workspace would make posture buildable only inside the repository the
# two happen to share. They ship as separate projects, so neither may compile
# against the other; speaking a protocol to an engine at runtime is a different
# thing and is unchanged.

[package]
name = "posture-adapters"
version = "0.1.0"
edition = "2024"

[dependencies]
posture-application = { path = "../posture-application" }
posture-domain = { path = "../posture-domain" }
posture-protocol = { path = "../posture-protocol" }
libc = "0.2.189"
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde = "1.0.229"
sha2 = "0.11.0"
hmac = "0.13.0"
# Parse only: nothing here ever writes TOML back out.
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
rusqlite = { version = "=0.39.0", default-features = false, features = [
  "bundled",
  "fallible_uint",
  "hooks",
] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
