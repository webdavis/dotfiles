# posture-pns-wire: the pns request and result envelopes, as posture speaks them.
#
# POSTURE'S OWN COPY, and deliberately not a dependency on pns. posture and pns
# ship as separate projects, installed one at a time by people who do not have
# the repository they were written in, so a cargo path climbing out of this
# workspace and into pns's would make posture buildable only there. Two programs
# that speak a protocol to each other are still two programs; each carries its
# own reading of the contract, and the golden fixtures beside this crate are
# what hold the two readings to the same bytes.
#
# A CLIENT'S HALF OF THE CONTRACT. posture writes requests and reads results, so
# the egress envelope is absent here: it is the leg from pns out to a delivery
# destination, which posture is not. Everything posture does touch is carried
# verbatim rather than trimmed to today's call sites, because a wire contract
# read half way is how two programs quietly stop agreeing.
#
# NO WORKSPACE DEPENDENCIES, deliberately, including posture-domain. If this
# imported the domain, the internal model would leak into an external contract
# and every domain change would become a wire change. The translation between
# the two lives in the adapters, where a version skew can be absorbed.
#
# The two dependencies are the format: an envelope is JSON, and JSON is a format
# nobody should hand-parse. `preserve_order` stays OFF here on purpose. Cargo
# unifies features across the workspace, so switching it on would re-order the
# keys of every JSON object this workspace writes.

[package]
name = "posture-pns-wire"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
